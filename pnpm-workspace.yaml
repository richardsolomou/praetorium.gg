packages:
  - .
  - mobile
  - spacetimedb

allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - ras-stack
  # PostHog is a trusted publisher whose SDK fixes should land the day they ship.
  - 'posthog-*'
  - '@posthog/*'
minimumReleaseAge: 10080
packageExtensions:
  # The Expo config plugin's compiled tooling requires @babel/runtime 7 subpaths without declaring it.
  posthog-react-native:
    dependencies:
      '@babel/runtime': ^7.20.0
overrides:
  'fflate@0.7.3': 0.7.5
  '@expo/fingerprint>minimatch': 11.0.8
