packages:
  - .
  - mobile

allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  # centrifuge pulls it in; we speak Centrifugo's JSON protocol and never protobuf,
  # so its build script has nothing to do here.
  protobufjs: false
minimumReleaseAgeExclude:
  - ras-stack@2.0.0
  - expo-file-system@57.0.6
  - expo-haptics@57.0.2
  # Server telemetry target from the SDK update report; the pins are hours short
  # of the age threshold and can be dropped once it passes.
  - posthog-node@5.52.3
  - '@posthog/core@1.54.1'
minimumReleaseAge: 10080
