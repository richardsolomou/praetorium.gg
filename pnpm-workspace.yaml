packages:
  - .
  - mobile
  - spacetimedb

allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  protobufjs: false
  workerd: true
minimumReleaseAgeExclude:
  - ras-stack-config@1.0.0
  - ras-stack@3.1.0
  - expo-file-system@57.0.6
  - expo-haptics@57.0.2
  # Server telemetry target from the SDK update report; the pins are hours short
  # of the age threshold and can be dropped once it passes.
  - posthog-node@5.52.3
  - '@posthog/core@1.54.1'
  # Approved early for automatic reconnect and module environments; drop once it passes the age threshold on 2026-10-20.
  - spacetimedb@2.12.0
minimumReleaseAge: 10080
patchedDependencies:
  '@better-auth/oauth-provider@1.7.7': patches/@better-auth__oauth-provider@1.7.7.patch
