allowBuilds:
  better-sqlite3: true
  core-js: true
  esbuild: true
  # centrifuge pulls it in; we speak Centrifugo's JSON protocol and never protobuf,
  # so its build script has nothing to do here.
  protobufjs: false
minimumReleaseAgeExclude:
  - ras-stack@0.44.0
minimumReleaseAge: 10080
peerDependencyRules:
  allowedVersions:
    better-sqlite3: '13'
