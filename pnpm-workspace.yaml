packages:
  - .
  - mobile

allowBuilds:
  core-js: true
  esbuild: true
  # centrifuge pulls it in; we speak Centrifugo's JSON protocol and never protobuf,
  # so its build script has nothing to do here.
  protobufjs: false
minimumReleaseAgeExclude:
  - ras-stack@0.47.0
  - expo-haptics@57.0.2
minimumReleaseAge: 10080
