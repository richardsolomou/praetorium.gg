packages:
  - .
  - mobile
  - spacetimedb

allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - ras-stack@5.0.0
  - ras-stack@5.1.0
  - ras-stack@5.2.1
  - ras-stack@5.3.0
minimumReleaseAge: 10080
packageExtensions:
  # The Expo config plugin's compiled tooling requires @babel/runtime 7 subpaths without declaring it.
  posthog-react-native:
    dependencies:
      '@babel/runtime': ^7.20.0
configDependencies:
  ras-stack: 5.3.0
pnpmfile: node_modules/.pnpm-config/ras-stack/pnpmfile.mjs
