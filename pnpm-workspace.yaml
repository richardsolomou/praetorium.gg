allowBuilds:
  better-sqlite3: true
  esbuild: true
  # centrifuge pulls it in; we speak Centrifugo's JSON protocol and never protobuf,
  # so its build script has nothing to do here.
  protobufjs: false
minimumReleaseAgeExclude:
  - csv-parse@7.0.2
  - jose@6.2.8
  - ras-stack@0.27.0
minimumReleaseAge: 10080
