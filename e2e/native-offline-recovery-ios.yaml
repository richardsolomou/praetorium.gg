- tapOn: Rosters
- assertVisible: 'EDITED NATIVE ARMY OFFLINE.*'
- takeScreenshot: native-edit-after-renderer-recovery
- tapOn: More
- tapOn:
    text: RULES Game reference
- scrollUntilVisible:
    element:
      text: '03\. Moving.*'
    direction: DOWN
    centerElement: true
- tapOn: '03\. Moving.*'
- extendedWaitUntil:
    notVisible: Find a rule
    timeout: 30000
- assertVisible: 03. Moving
