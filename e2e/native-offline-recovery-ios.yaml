appId: gg.praetorium
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 03. Moving
    timeout: 30000
- takeScreenshot: native-renderer-recovered
- tapOn: Praetorium home
- assertVisible: '(?i)Welcome back, Native.*'
- takeScreenshot: native-home-after-renderer-recovery
- tapOn: Rosters
- assertVisible: 'EDITED NATIVE ARMY OFFLINE.*'
- takeScreenshot: native-edit-after-renderer-recovery
- tapOn: More
- tapOn:
    text: '(?i)^Rules Core rules.*'
- runFlow: native-open-moving-rule.yaml
