appId: gg.praetorium
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Praetorium home
    timeout: 30000
- tapOn: Praetorium home
- tapOn: Rosters
- assertVisible: 'EDITED NATIVE ARMY OFFLINE.*'
- takeScreenshot: native-edit-after-cold-reopen
- tapOn: Battles
- tapOn: '(?is).*Practice Opponent.*'
- tapOn: Armies
- assertVisible: '(?i)Edited native army offline.*'
- takeScreenshot: native-battle-after-cold-reopen
- tapOn: More
- tapOn:
    text: RULES Game reference
# The sync banner appears ten seconds into unsynced work and, without WebKit scroll anchoring, shifts the list under a tap.
- extendedWaitUntil:
    visible: '.*change.*waiting to sync'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '03\. Moving.*'
    direction: DOWN
    centerElement: true
- tapOn: '03\. Moving.*'
- extendedWaitUntil:
    notVisible: Find a rule
    timeout: 30000
- assertVisible: 03. Moving
