services:
  praetorium:
    build:
      context: .
    restart: unless-stopped
    # One instance, always. Live updates fan out inside the process, so a second
    # replica would serve battles that never hear about each other's commands.
    deploy:
      replicas: 1
    ports:
      - '3030:3000'
    environment:
      # Public origin of the deployment. Only needed when proxy headers cannot
      # represent it; mutations are rejected from any other origin.
      APP_URL: ${APP_URL:-}
      # Signs account sessions. Generated into /data when unset; changing it
      # signs every player out, but does not remove their data.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Each provider appears on the sign-in page only when both halves are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      # The SQLite database holding every battle and its command log.
      - ${DATA_HOST_DIR:-./praetorium-data}:/data
