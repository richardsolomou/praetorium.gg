services:
  praetorium:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '3030:3000'
    environment:
      # Accounts, lists, battles and every command in their logs.
      DATABASE_URL: postgres://${POSTGRES_USER:-praetorium}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praetorium}
      # Sessions, the auth limiter, and Centrifugo's fan-out between replicas.
      # Remove it and the deployment is one replica again, which still works.
      VALKEY_URL: redis://valkey:6379
      # Public origin of the deployment. Only needed when proxy headers cannot
      # represent it; mutations are rejected from any other origin.
      APP_URL: ${APP_URL:-}
      # Where profile pictures are uploaded to, and (unset) the community catalogue
      # is mirrored from. Compose's own MinIO by default; point at any
      # S3-compatible store instead, with S3_PUBLIC_BASE_URL set to wherever it is
      # publicly reachable.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-praetorium}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-praetorium}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-praetorium-storage}
      # Only correct when the browser reaches this host as `localhost`; a real
      # deployment behind a domain must set this to wherever the store is
      # actually publicly reachable, and set S3_BUCKET to match if it differs.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/praetorium}
      # Signs account sessions. Generated into /data when unset; changing it
      # signs every player out, but does not remove their data.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Each provider appears on the sign-in page only when both halves are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Set these three to point at a Centrifugo of your own instead of the one
      # the container runs behind Caddy. Leave them unset for that one.
      REALTIME_SECRET: ${REALTIME_SECRET:-}
      REALTIME_API_URL: ${REALTIME_API_URL:-}
      REALTIME_URL: ${REALTIME_URL:-}
      # Connections each replica keeps open against Postgres.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      # Secrets and the catalogue cache. The game data lives in Postgres now, so
      # this holds nothing that cannot be rebuilt except the signing secrets.
      - ${DATA_HOST_DIR:-./praetorium-data}:/data

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praetorium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-praetorium}
    healthcheck:
      # The app migrates on the way up, so it must not start before this answers.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-praetorium} -d ${POSTGRES_DB:-praetorium}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Postgres 18 puts its cluster in a version-named subdirectory, so the mount
      # belongs one level above `data` — where `pg_upgrade` can reach both.
      - praetorium-postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    # Sessions are worth keeping across a restart, so this is not a pure cache.
    command: ['valkey-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - praetorium-valkey:/data

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-praetorium}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-praetorium-storage}
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    # Published, not just exposed: a browser reads pictures back from here
    # directly, not through the app.
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - praetorium-minio:/data

  # Runs once: creates the bucket and lets it be read anonymously, the same
  # shape as the public catalogue mirror. Nothing inside it needs the same
  # openness — only the keys the app chooses to write are reachable, never a
  # directory listing.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-praetorium}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-praetorium-storage}
      BUCKET: ${S3_BUCKET:-praetorium}
    entrypoint: ['sh', '-c']
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set download "local/$$BUCKET"

volumes:
  praetorium-postgres:
  praetorium-valkey:
  praetorium-minio:
