name: Mobile stable delivery

on:
  push:
    tags: [mobile-stable-*]

concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: false

jobs:
  fingerprint:
    name: Fingerprint native projects
    type: fingerprint
    environment: production
  get_android_build:
    name: Find matching Android release
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
      wait_for_in_progress: true
  build_android:
    name: Build Android release
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS release
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Send iOS release to App Store Connect
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
  update_android:
    name: Update stable Android installations
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: stable
      platform: android
  update_ios:
    name: Update stable iOS installations
    needs: [submit_ios]
    type: update
    environment: production
    params:
      channel: stable
      platform: ios
  complete:
    name: Delivery complete ${{ github.ref_name }}
    after: [build_android, update_android, update_ios]
    environment: production
    steps:
      - name: Verify delivery
        run: |
          test "${{ after.build_android.status }}" = success || test "${{ after.update_android.status }}" = success
          test "${{ after.update_ios.status }}" = success
