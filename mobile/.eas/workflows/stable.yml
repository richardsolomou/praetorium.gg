name: Mobile stable

on:
  push:
    branches: [main]
    paths: [mobile/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml]

concurrency:
  group: mobile-stable
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Fingerprint native projects
    type: fingerprint
    environment: production
  get_android_build:
    name: Find matching Android release
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
      wait_for_in_progress: true
  get_ios_build:
    name: Find matching iOS release
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
      wait_for_in_progress: true
  build_android:
    name: Build Android release
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS release
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Send iOS release to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
  update_android:
    name: Update stable Android installations
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      channel: stable
      platform: android
  update_ios:
    name: Update stable iOS installations
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      channel: stable
      platform: ios
