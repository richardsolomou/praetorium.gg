version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - posthog-*
        - '@posthog/*'
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      # Better Auth's plugins pin its core version, so they must move with it; Dependabot puts a package in its first matching group.
      better-auth:
        applies-to: version-updates
        patterns:
          - better-auth
          - '@better-auth/*'
      # The experimental 0.x OpenTelemetry packages pin exact versions of the stable ones and peer on one @opentelemetry/api minor.
      opentelemetry:
        applies-to: version-updates
        patterns:
          - '@opentelemetry/*'
      # The CLI pins, their checksums and the generated bindings must move with the SDK by hand, so it never blocks other updates.
      spacetimedb:
        applies-to: version-updates
        patterns:
          - spacetimedb
      patch-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - patch
      minor-updates:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: richardsolomou/ras-stack*
        update-types:
          - version-update:semver-major
