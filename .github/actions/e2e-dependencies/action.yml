name: E2E dependencies
description: Restore node_modules and the Playwright browser, installing them on a cache miss.
runs:
  using: composite
  steps:
    - name: Restore E2E dependencies
      id: e2e-dependencies
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          ~/.cache/ms-playwright
        # Not package.json: every release bumps its version, and the lockfile records its dependencies.
        key: ${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'ras.config.ts') }}
    - name: Install E2E dependencies
      if: steps.e2e-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm exec playwright install chromium --only-shell
