name: Set up SpacetimeDB
description: Install the pinned SpacetimeDB CLI.
outputs:
  cli-path:
    description: Path to the installed CLI.
    value: ${{ steps.spacetime.outputs.cli-path }}
runs:
  using: composite
  steps:
    - uses: richardsolomou/ras-stack/actions/setup-spacetime@v1
      id: spacetime
      with:
        version: '2.13.0'
        sha256: 034fe43ebb42e8d291c6ba18b6b3a6ac9a3bb4aa548d37743340362cb021165e
