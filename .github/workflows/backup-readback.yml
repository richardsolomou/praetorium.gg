name: Production backup readback

on:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * 0'

permissions:
  contents: read

jobs:
  spacetime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Restore off-host SpacetimeDB volumes and read private rows
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          SPACETIME_OWNER_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
        run: bash scripts/verifySpacetimeBackup.sh
