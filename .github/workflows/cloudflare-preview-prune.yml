name: Cloudflare preview prune

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Find open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numbers="$(gh pr list --state open --limit 1000 --json number --jq '.[].number' | tr '\n' ' ')"
          echo "OPEN_PR_NUMBERS=$numbers" >> "$GITHUB_ENV"
      - name: Remove resources left by closed pull requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
        run: pnpm exec tsx scripts/cloudflarePreview.ts prune
