name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CATALOGUE_SNAPSHOT_BASE_URL: ${{ vars.CATALOGUE_SNAPSHOT_BASE_URL }}

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v0.39.5
    with:
      command: just check
      just-version: '1.58.0'

  e2e-shard:
    name: E2E shard ${{ matrix.shard }} of 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.39.3
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.39.3
        with:
          version: '1.58.0'
      - run: just catalogue-sync
      - name: Require the terrain geometry
        run: |
          set -euo pipefail
          test -n "$(ls -A catalogue-data/battlemaster/layouts 2>/dev/null || true)" \
            || { echo 'catalogue-data/battlemaster/layouts is empty; re-run the catalogue sync'; exit 1; }
      - run: just descriptions
      - run: just e2e-install
      - uses: docker/setup-buildx-action@v4
      - name: Build the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: praetorium-e2e
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=min,scope=e2e-image
      # Separate runners give each shard its own CPU, container, and database.
      - name: Run E2E shard
        run: pnpm exec playwright test --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Keep one stable required check while the expensive work runs in parallel.
  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E shard
        run: test '${{ needs.e2e-shard.result }}' = success

  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.39.3
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.39.3
        with:
          version: '1.58.0'
      - run: just catalogue-sync
      # The points reference match rate must not fall.
      - run: just points | tee points.txt
      - name: Require complete agreement
        run: |
          set -euo pipefail
          matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' points.txt)
          checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' points.txt)
          echo "$matched of $checked"
          test "$checked" -ge 1500
          test "$matched" -eq "$checked"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e, points]
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.39.5
    secrets: inherit

  production-image:
    if: needs.release.outputs.created == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.39.3
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.39.3
        with:
          version: '1.58.0'
      - run: just catalogue-sync
      - name: Require the terrain geometry
        run: |
          set -euo pipefail
          test -n "$(ls -A catalogue-data/battlemaster/layouts 2>/dev/null || true)" \
            || { echo 'catalogue-data/battlemaster/layouts is empty; re-run the catalogue sync'; exit 1; }
      - run: just descriptions
      - name: Build and publish production image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v0.39.3
        with:
          image: ghcr.io/${{ github.repository }}
          sha: ${{ needs.release.outputs.sha }}
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      - name: Deploy production image
        if: vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v0.39.3
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
