name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.0
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.47.0
        with:
          version: '1.58.0'
      - name: Run checks
        run: just check

  e2e-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-name: ${{ steps.image.outputs.artifact-name }}
      local-image: ${{ steps.image.outputs.local-image }}
      registry-image: ${{ steps.image.outputs.registry-image }}
      source: ${{ steps.image.outputs.source }}
    steps:
      - name: Name the image
        id: image
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "local-image=praetorium.gg:preview-pr-$PR_NUMBER-sha-$PR_SHA"
              if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
                echo "artifact-name=preview-image-$PR_NUMBER"
                echo "source=artifact"
              else
                echo "registry-image=ghcr.io/$GITHUB_REPOSITORY_OWNER/praetorium.gg:preview-pr-$PR_NUMBER-sha-$PR_SHA"
                echo "source=registry"
              fi
            else
              echo "local-image=praetorium-e2e:sha-$GITHUB_SHA"
              echo "artifact-name=e2e-image-$GITHUB_RUN_ID"
              echo "source=artifact"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.image.outputs.source == 'artifact'
      - uses: docker/setup-buildx-action@v4
        if: steps.image.outputs.source == 'artifact'
      - name: Log in to the container registry
        if: steps.image.outputs.source == 'registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Wait for the preview image
        if: steps.image.outputs.source == 'registry'
        env:
          REGISTRY_IMAGE: ${{ steps.image.outputs.registry-image }}
        run: |
          set -euo pipefail
          for _ in {1..150}; do
            if docker manifest inspect "$REGISTRY_IMAGE" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for $REGISTRY_IMAGE"
          exit 1
      - name: Build the application image
        if: steps.image.outputs.source == 'artifact'
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.image.outputs.local-image }}
          outputs: type=docker,dest=${{ runner.temp }}/preview-image.tar
          cache-from: type=gha,scope=e2e-image
      - name: Store the application image
        if: steps.image.outputs.source == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.image.outputs.artifact-name }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 1

  e2e-shard:
    name: E2E runner ${{ matrix.runner }} of 8
    needs: [e2e-image]
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.0
        with:
          install: 'false'
      - uses: ./.github/actions/e2e-dependencies
      - run: pnpm catalogue:sync
      - name: Require the terrain geometry
        run: |
          set -euo pipefail
          test -n "$(ls -A catalogue-data/battlemaster/layouts 2>/dev/null || true)" \
            || { echo 'catalogue-data/battlemaster/layouts is empty; re-run the catalogue sync'; exit 1; }
      - name: Log in to the container registry
        if: needs.e2e-image.outputs.source == 'registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: needs.e2e-image.outputs.source == 'artifact'
        with:
          name: ${{ needs.e2e-image.outputs.artifact-name }}
          path: ${{ runner.temp }}/praetorium-e2e-image
      - name: Load the application image
        if: needs.e2e-image.outputs.source == 'artifact'
        env:
          LOCAL_IMAGE: ${{ needs.e2e-image.outputs.local-image }}
        run: |
          docker load --input "$RUNNER_TEMP/praetorium-e2e-image/preview-image.tar"
          docker tag "$LOCAL_IMAGE" praetorium-e2e
      - name: Pull the application image
        if: needs.e2e-image.outputs.source == 'registry'
        env:
          REGISTRY_IMAGE: ${{ needs.e2e-image.outputs.registry-image }}
        run: |
          docker pull "$REGISTRY_IMAGE"
          docker tag "$REGISTRY_IMAGE" praetorium-e2e
      - name: Run the E2E shard
        env:
          E2E_SHARD: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          PLAYWRIGHT_PORT="$((4170 + E2E_SHARD))" \
            PLAYWRIGHT_DATA_ROOT="/tmp/praetorium-e2e-$E2E_SHARD" \
            PLAYWRIGHT_OUTPUT_DIR="test-results-$E2E_SHARD" \
            pnpm exec playwright test --workers=1 --shard="$E2E_SHARD/8"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.runner }}
          path: |
            test-results
            test-results-*
          retention-days: 7

  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E runner
        run: test '${{ needs.e2e-shard.result }}' = success

  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.0
      - run: pnpm catalogue:sync
      - run: pnpm catalogue:descriptions
      - run: pnpm catalogue:points | tee points.txt
      - name: Require complete agreement
        run: |
          set -euo pipefail
          matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' points.txt)
          checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' points.txt)
          echo "$matched of $checked"
          # The floor is deliberately looser than the baseline described in
          # docs/development/catalogue-data.md; full agreement is what gates.
          test "$checked" -ge 1500
          test "$matched" -eq "$checked"

  coverage:
    # A dropped field still renders, so it throws no exception and moves no event
    # count. This job snapshots what the app can say about the data before and
    # after the change and fails when the change drops any of it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Pricing a unit boots the app, which keeps its auth secret on disk. The deployed
    # default is /data, which the runner cannot write to. Set here rather than only in
    # the script, because the base snapshot runs the base revision of that script.
    # The runner context is not available to a job-level env, only to a step.
    env:
      DATA_DIR: ${{ github.workspace }}/.coverage-data
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.0
      - run: pnpm catalogue:sync
      # Both snapshots must read one revision.json, or an upstream change between
      # the runs reads back as a phantom loss. app() refetches the catalogue when
      # it starts, so keep a pristine copy and restore it before each snapshot.
      - name: Pin the catalogue snapshot
        run: cp -a catalogue-data catalogue-data.pinned
      # Each snapshot installs the dependencies of the revision it measures, so a
      # dependency bump is compared honestly instead of running both sides on the
      # head's node_modules, which is where a parser bump would drop fields unseen.
      - name: Snapshot the base
        run: |
          set -euo pipefail
          git checkout --quiet --force ${{ github.event.pull_request.base.sha }}
          pnpm install --frozen-lockfile
          rm -rf catalogue-data && cp -a catalogue-data.pinned catalogue-data
          pnpm catalogue:coverage base.json
      - name: Snapshot the head and compare
        run: |
          set -euo pipefail
          git checkout --quiet --force ${{ github.sha }}
          pnpm install --frozen-lockfile
          rm -rf catalogue-data && cp -a catalogue-data.pinned catalogue-data
          pnpm catalogue:coverage head.json --compare base.json | tee coverage.txt
      - name: Require no lost coverage
        run: |
          set -euo pipefail
          lost=$(sed -n 's/^## lost (\([0-9]*\)).*/\1/p' coverage.txt)
          echo "lost: ${lost:-unknown}"
          test "${lost:-1}" -eq 0
