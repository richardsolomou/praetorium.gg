name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v0.30.0
    with:
      command: just check
      just-version: '1.58.0'

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.30.0
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.30.0
        with:
          version: '1.58.0'
      # Keyed on the pinned revisions, so the data is fetched once per bump rather
      # than once per run: it is 60MB of catalogues and does not change otherwise.
      - name: Cache the catalogue data
        id: catalogue
        uses: actions/cache@v6
        with:
          path: catalogue-data
          key: catalogue-${{ hashFiles('catalogue/sources.json') }}
      - if: steps.catalogue.outputs.cache-hit != 'true'
        run: just catalogue-sync
      - run: just descriptions
      - run: just e2e-install
      - uses: docker/setup-buildx-action@v4
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            praetorium-e2e
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: just e2e-run
      - if: github.ref == 'refs/heads/main'
        run: docker push --all-tags ghcr.io/${{ github.repository }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.30.0
      - uses: richardsolomou/ras-stack/actions/setup-just@v0.30.0
        with:
          version: '1.58.0'
      - name: Cache the catalogue data
        id: catalogue
        uses: actions/cache@v6
        with:
          path: catalogue-data
          key: catalogue-${{ hashFiles('catalogue/sources.json') }}
      - if: steps.catalogue.outputs.cache-hit != 'true'
        run: just catalogue-sync
      # The points reference match rate must not fall.
      - run: just points | tee points.txt
      - name: Hold the agreement above its floor
        run: |
          set -euo pipefail
          matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' points.txt)
          checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' points.txt)
          echo "$matched of $checked"
          test "$checked" -ge 1500
          test "$((matched * 1000 / checked))" -ge 970

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e, points]
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.30.0
    secrets: inherit
