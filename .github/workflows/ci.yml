name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request runs only what its change can affect, so main runs everything after each merge.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e-runners:
        description: Most browser runners, for a timing comparison
        type: choice
        options: ['14', '8']
        default: '14'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main finishes the run it started and keeps only the newest merge waiting, so the latest main always gets the full suite.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `just check` runs these lanes in sequence locally; CI runs them side by side so the fast ones answer first.
# Each lane's steps live in its own `ci-<lane>.yml`, and main requires its checks as `<lane> / <job>`. A lane always
# runs and skips its own jobs for a change without runtime code, because a skipped check passes and a missing one blocks.
# A draft PR runs only the quick lanes (static, unit, build); marking it ready for review starts a run with every lane.
jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  static-lane:
    needs: changes
    uses: ./.github/workflows/ci-static.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}
    secrets: inherit

  unit-lane:
    needs: changes
    uses: ./.github/workflows/ci-unit.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}
    secrets: inherit

  integration-lane:
    needs: changes
    uses: ./.github/workflows/ci-integration.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' && !github.event.pull_request.draft }}
    secrets: inherit

  build-lane:
    # Starts beside the browser-test build: both restore the shared catalogue, and on a compiler change both compile it rather than one waiting for the other.
    needs: changes
    uses: ./.github/workflows/ci-build.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}
    secrets: inherit

  live-catalogue:
    needs: [changes, browser-build]
    # Not for Dependabot: its runs execute dependency versions nobody has reviewed, and this job holds the public store's write key.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && needs.browser-build.outputs.runtime-shared != 'true'
    # The release prepares it anyway, so a failure here costs only time.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.SNAPSHOT_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOT_R2_SECRET_ACCESS_KEY }}
      ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm exec tsx scripts/prepareLiveCatalogue.ts production

  browser-build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/ci-browser-build.yml
    with:
      e2e-runners: ${{ inputs.e2e-runners }}
    secrets: inherit

  e2e-lane:
    needs: browser-build
    if: needs.browser-build.outputs.needed == 'true'
    uses: ./.github/workflows/ci-e2e.yml
    with:
      node-version: ${{ needs.browser-build.outputs.node-version }}
      runner-count: ${{ needs.browser-build.outputs.runner-count }}
      runners: ${{ needs.browser-build.outputs.runners }}
    secrets: inherit

  points-lane:
    needs: changes
    uses: ./.github/workflows/ci-points.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' && !github.event.pull_request.draft }}
    secrets: inherit

  coverage-lane:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' && !github.event.pull_request.draft
    uses: ./.github/workflows/ci-coverage.yml
    secrets: inherit

  ready:
    # A skipped job passes a required check, so this one needs every lane and fails on a draft: whatever a draft's run
    # skipped, the PR can't merge until the run that marking it ready starts has passed.
    if: always()
    needs: [changes, static-lane, unit-lane, integration-lane, build-lane, browser-build, e2e-lane, points-lane, coverage-lane]
    runs-on: ubuntu-latest
    steps:
      - name: Require a PR that is ready for review
        if: github.event.pull_request.draft
        run: |
          echo '::error::A draft runs only the quick checks. Mark the PR ready for review to run the browser tests, integration, points and coverage.'
          exit 1
      - name: Require every lane
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled" or (.key == "changes" and .value.result != "success")) | .key] | join(", ")' <<< "$NEEDS")"
          test -z "$failed" || { echo "::error::Failed: $failed"; exit 1; }

  main-failure:
    # One open issue says main is red, so a failure the merged pull request's selection missed is seen; the next green run closes it.
    if: always() && github.event_name == 'push'
    needs: ready
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: CI fails on main
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        if: needs.ready.result == 'failure'
        run: |
          issue="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          body="The full suite failed on ${GITHUB_SHA::9}: $RUN_URL"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
      - name: Close the issue
        if: needs.ready.result == 'success'
        run: |
          issue="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          if [ -n "$issue" ]; then gh issue close "$issue" --comment "Passing again on ${GITHUB_SHA::9}: $RUN_URL"; fi
