name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@11.15.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run independent checks
        run: |
          set -euo pipefail
          pids=()
          pnpm format:check & pids+=("$!")
          pnpm lint & pids+=("$!")
          pnpm db:check & pids+=("$!")
          pnpm catalogue:check & pids+=("$!")
          pnpm build & pids+=("$!")
          pnpm test & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      # The build generates src/routeTree.gen.ts, which typecheck needs.
      - run: pnpm typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@11.15.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keyed on the pinned revisions, so the data is fetched once per bump rather
      # than once per run: it is 60MB of catalogues and does not change otherwise.
      - name: Cache the catalogue data
        id: catalogue
        uses: actions/cache@v5
        with:
          path: catalogue-data
          key: catalogue-${{ hashFiles('catalogue/sources.json') }}
      - if: steps.catalogue.outputs.cache-hit != 'true'
        run: pnpm catalogue:sync
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@11.15.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the catalogue data
        id: catalogue
        uses: actions/cache@v5
        with:
          path: catalogue-data
          key: catalogue-${{ hashFiles('catalogue/sources.json') }}
      - if: steps.catalogue.outputs.cache-hit != 'true'
        run: pnpm catalogue:sync
      # The ratchet: agreement with Games Workshop's own points must not fall.
      - run: pnpm catalogue:points | tee points.txt
      - name: Hold the agreement above its floor
        run: |
          set -euo pipefail
          matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' points.txt)
          checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' points.txt)
          echo "$matched of $checked"
          test "$checked" -ge 1500
          test "$((matched * 1000 / checked))" -ge 970

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
