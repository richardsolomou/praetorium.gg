name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: richardsolomou/ras-stack/actions/setup-just@v1
        with:
          version: '1.58.0'
      - name: Run checks
        run: just check

  reference-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm catalogue:sync
      - run: pnpm reference:evaluate

  e2e-shard:
    name: E2E runner ${{ matrix.runner }} of 8
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
        with:
          install: 'false'
      - uses: ./.github/actions/e2e-dependencies
      - run: pnpm catalogue:sync
      - name: Require the terrain geometry
        run: pnpm catalogue:terrain
      - name: Install pinned SpacetimeDB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli spacetimedb-standalone
      - name: Run the E2E shard
        env:
          E2E_SHARD: ${{ matrix.runner }}
          SPACETIME_BIN: ${{ runner.temp }}/spacetimedb-cli
        run: |
          set -euo pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/e2e-tests.json" pnpm exec playwright test --list --reporter=json > /dev/null
          node --import tsx scripts/e2eShard.ts "$RUNNER_TEMP/e2e-tests.json" "$E2E_SHARD" 8 > "$RUNNER_TEMP/e2e-shard.txt"
          PLAYWRIGHT_PORT="$((4170 + E2E_SHARD))" \
            PLAYWRIGHT_DATA_ROOT="/tmp/praetorium-e2e-$((4170 + E2E_SHARD))" \
            PLAYWRIGHT_OUTPUT_DIR="test-results-$E2E_SHARD" \
            PLAYWRIGHT_JSON_OUTPUT_NAME="e2e-report-$E2E_SHARD.json" \
            pnpm exec playwright test --workers=1 --test-list="$RUNNER_TEMP/e2e-shard.txt" --reporter=github,json
      # `just e2e-durations <run id>` rebalances the runners from these reports.
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.runner }}
          path: e2e-report-${{ matrix.runner }}.json
          retention-days: 30
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.runner }}
          path: |
            test-results
            test-results-*
          retention-days: 7

  e2e:
    if: always()
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E runner
        run: test '${{ needs.e2e-shard.result }}' = success

  points:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm catalogue:sync
      # Definitions and the points reference can publish at different times. Run
      # both revisions against one snapshot so upstream drift cannot make an
      # unrelated pull request fail or hide a pricing regression.
      - name: Pin the catalogue snapshot
        run: cp -a catalogue-data catalogue-data.pinned
      - name: Measure the base
        run: |
          set -euo pipefail
          git checkout --quiet --force "$BASE_SHA"
          pnpm install --frozen-lockfile
          rm -rf catalogue-data && cp -a catalogue-data.pinned catalogue-data
          pnpm catalogue:descriptions
          pnpm catalogue:points | tee base-points.txt
      - name: Measure the head
        run: |
          set -euo pipefail
          git checkout --quiet --force "$HEAD_SHA"
          pnpm install --frozen-lockfile
          rm -rf catalogue-data && cp -a catalogue-data.pinned catalogue-data
          pnpm catalogue:descriptions
          pnpm catalogue:points | tee head-points.txt
      - name: Require no points regression
        run: |
          set -euo pipefail
          base_matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' base-points.txt)
          base_checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' base-points.txt)
          head_matched=$(sed -n 's/^matched: *\([0-9]*\).*/\1/p' head-points.txt)
          head_checked=$(sed -n 's/^evaluated: *\([0-9]*\).*/\1/p' head-points.txt)
          : "${base_matched:?missing base matched count}"
          : "${base_checked:?missing base evaluated count}"
          : "${head_matched:?missing head matched count}"
          : "${head_checked:?missing head evaluated count}"
          echo "base: $base_matched of $base_checked"
          echo "head: $head_matched of $head_checked"
          test "$head_checked" -ge 1500
          test "$((head_matched * base_checked))" -ge "$((base_matched * head_checked))"

  coverage-data:
    # A dropped field still renders, so it throws no exception and moves no event
    # count. This job snapshots what the app can say about the data before and
    # after the change and fails when the change drops any of it.
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.revisions.outputs.base-sha }}
      head-sha: ${{ steps.revisions.outputs.head-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Resolve compared revisions
        id: revisions
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "$GITHUB_SHA^1")"
          {
            echo "base-sha=$base_sha"
            echo "head-sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm catalogue:sync
      # Both snapshots must read one revision.json, or an upstream change between
      # the runs reads back as a phantom loss.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-catalogue
          path: catalogue-data
          retention-days: 1
          compression-level: 1
          include-hidden-files: true
          if-no-files-found: error

  coverage-snapshot:
    needs: [coverage-data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: base
            sha: ${{ needs.coverage-data.outputs.base-sha }}
          - revision: head
            sha: ${{ needs.coverage-data.outputs.head-sha }}
    steps:
      # Each snapshot installs the dependencies of the revision it measures, so a
      # dependency bump is compared honestly instead of running both sides on the
      # head's node_modules, which is where a parser bump would drop fields unseen.
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: actions/download-artifact@v8
        with:
          name: coverage-catalogue
          path: catalogue-data
      - name: Restore the base snapshot
        if: matrix.revision == 'base'
        id: base-cache
        uses: actions/cache@v6
        with:
          path: base.json
          key: catalogue-coverage-${{ matrix.sha }}-${{ hashFiles('catalogue-data/.snapshot.json') }}
      - name: Snapshot the ${{ matrix.revision }}
        if: matrix.revision == 'head' || steps.base-cache.outputs.cache-hit != 'true'
        run: pnpm catalogue:coverage:parallel ${{ matrix.revision }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.revision }}
          path: ${{ matrix.revision }}.json
          retention-days: 1
          if-no-files-found: error

  coverage:
    if: always()
    needs: [coverage-snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: Require both snapshots
        run: test '${{ needs.coverage-snapshot.result }}' = success
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: actions/download-artifact@v8
        with:
          name: coverage-catalogue
          path: catalogue-data
      - uses: actions/download-artifact@v8
        with:
          name: coverage-base
      - uses: actions/download-artifact@v8
        with:
          name: coverage-head
      - name: Compare snapshots
        run: |
          set -euo pipefail
          pnpm catalogue:coverage:compare base.json head.json --accept catalogue/accepted-coverage-losses.json | tee coverage.txt
      - name: Require no lost coverage
        run: |
          set -euo pipefail
          lost=$(sed -n 's/^## lost (\([0-9]*\)).*/\1/p' coverage.txt)
          echo "lost: ${lost:-unknown}"
          test "${lost:-1}" -eq 0
