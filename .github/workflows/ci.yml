name: CI

on:
  # A pull request runs only the browser specs its change exercises, and that run is the required
  # `e2e` check; the daily run is the full suite that catches a spec the selection missed.
  pull_request:
  # The daily run also records the source each spec executes, which pull requests choose their specs from.
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      e2e-runners:
        description: Browser runners for a timing comparison
        type: choice
        options: ['14', '16', '8']
        default: '14'
      coverage:
        description: Record the coverage map that pull requests choose specs from
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `just check` runs these lanes in sequence locally; CI runs them side by side so the fast ones answer first.
# Each lane's steps live in its own `ci-<lane>.yml`. GitHub names a called workflow's checks `<caller> / <job>`,
# so the short job after each lane reports it under the name the main branch requires, and skips when it skips.
jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  static-lane:
    needs: changes
    uses: ./.github/workflows/ci-static.yml
    with:
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}
    secrets: inherit

  static:
    needs: static-lane
    if: ${{ !cancelled() && needs.static-lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.static-lane.result }}' = success

  unit-lane:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-unit.yml
    secrets: inherit

  unit:
    needs: unit-lane
    if: ${{ !cancelled() && needs.unit-lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.unit-lane.result }}' = success

  integration-lane:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-integration.yml
    secrets: inherit

  integration:
    needs: integration-lane
    if: ${{ !cancelled() && needs.integration-lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.integration-lane.result }}' = success

  build-lane:
    # The browser-test build compiles and shares a new catalogue first, so this lane restores it rather than compiling it a second time.
    needs: [changes, browser-build]
    if: ${{ !cancelled() && needs.changes.outputs.runtime == 'true' }}
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit

  build:
    needs: build-lane
    if: ${{ !cancelled() && needs.build-lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.build-lane.result }}' = success

  live-catalogue:
    needs: [changes, browser-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.browser-build.outputs.runtime-cached != 'true'
    # The release prepares it anyway, so a failure here costs only time.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm exec tsx scripts/prepareLiveCatalogue.ts production

  browser-build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-browser-build.yml
    with:
      e2e-runners: ${{ inputs.e2e-runners }}
    secrets: inherit

  e2e-lane:
    needs: browser-build
    if: needs.browser-build.outputs.runner-count != '0'
    uses: ./.github/workflows/ci-e2e.yml
    with:
      node-version: ${{ needs.browser-build.outputs.node-version }}
      runner-count: ${{ needs.browser-build.outputs.runner-count }}
      runners: ${{ needs.browser-build.outputs.runners }}
      specs: ${{ needs.browser-build.outputs.specs }}
      coverage: ${{ github.event_name == 'schedule' || inputs.coverage == true }}
    secrets: inherit

  e2e:
    if: always()
    needs: [changes, browser-build, e2e-lane]
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E runner
        if: needs.changes.outputs.runtime != 'false'
        run: |
          test '${{ needs.changes.result }}' = success
          test '${{ needs.browser-build.result }}' = success
          # A change no spec exercises runs no browser runner.
          test '${{ needs.e2e-lane.result }}' = success || { test '${{ needs.browser-build.outputs.runner-count }}' = 0 && test '${{ needs.e2e-lane.result }}' = skipped; }

  points-lane:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-points.yml
    secrets: inherit

  points:
    needs: points-lane
    if: ${{ !cancelled() && needs.points-lane.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.points-lane.result }}' = success

  coverage-lane:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-coverage.yml
    secrets: inherit

  coverage:
    # A failed scope decision still fails here, because no snapshot ran.
    if: always() && needs.changes.outputs.runtime != 'false' && needs.coverage-lane.outputs.needed != 'false'
    needs: [changes, coverage-lane]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.coverage-lane.result }}' = success
