name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    with:
      validation-workflow: ci.yml
    secrets: inherit

  dokploy-production:
    needs: [release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dokploy-web.yml
    with:
      environment: production
      revision: ${{ needs.release.outputs.sha || github.sha }}
    secrets: inherit
