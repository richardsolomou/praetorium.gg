name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v2
    with:
      validation-workflow: ci.yml
    secrets: inherit

  cloudflare-production:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Fetch verified catalogue
        run: pnpm catalogue:sync
      - name: Build native Worker
        env:
          NITRO_PRESET: cloudflare_module
          GITHUB_SHA: ${{ needs.release.outputs.sha || github.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: pnpm build
      - name: Install verified catalogue assets
        run: |
          pnpm catalogue:worker
          pnpm catalogue:worker:assets
      - name: Build SpacetimeDB module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
      - name: Detect first production cutover
        id: cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
        run: bash scripts/detectCloudflareCutover.sh >> "$GITHUB_OUTPUT"
      - name: Freeze previous application writes
        if: steps.cutover.outputs.needed == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: bash scripts/freezeDokployRuntime.sh
      - name: Copy final public objects to R2
        if: steps.cutover.outputs.needed == 'true'
        env:
          SOURCE_S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          SOURCE_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          SOURCE_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
        run: bash scripts/migratePublicObjects.sh
      - name: Restore final Postgres backup and export data
        if: steps.cutover.outputs.needed == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_POSTGRES_ID: Ww_-3KD0nTcVW4JZMYZ2V
          BACKUP_OUTPUT: ${{ runner.temp }}/cutover-postgres.sql.gz
          RUN_MANUAL_BACKUP: true
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          bash scripts/verifyCutoverFreeze.sh
          bash scripts/fetchDokployPostgresBackup.sh
          docker run --detach --name praetorium-cutover-postgres \
            --env POSTGRES_PASSWORD=cutover-local \
            --publish 127.0.0.1:55432:5432 postgres:18-alpine > /dev/null
          trap 'docker rm --force praetorium-cutover-postgres > /dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            if docker exec praetorium-cutover-postgres pg_isready -U postgres > /dev/null 2>&1; then break; fi
            sleep 2
          done
          gzip -cd "$BACKUP_OUTPUT" | docker exec -i praetorium-cutover-postgres \
            pg_restore --exit-on-error --no-owner --no-privileges -U postgres -d postgres
          export DATABASE_URL=postgres://postgres:cutover-local@127.0.0.1:55432/postgres
          pnpm auth:export "$RUNNER_TEMP/cutover-auth"
          pnpm auth:verify "$RUNNER_TEMP/cutover-auth"
          pnpm product:export "$RUNNER_TEMP/cutover-product"
          pnpm product:verify "$RUNNER_TEMP/cutover-product"
      - name: Refresh production D1 accounts
        if: steps.cutover.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.production.json --remote \
            --output "$RUNNER_TEMP/previous-production-auth.sql" --skip-confirmation
          cat drizzle-auth/[0-9]*.sql "$RUNNER_TEMP/cutover-auth/auth.sql" > "$RUNNER_TEMP/source-auth.sql"
          python3 scripts/refreshAuthD1.py "$RUNNER_TEMP/source-auth.sql" \
            "$RUNNER_TEMP/previous-production-auth.sql" "$RUNNER_TEMP/production-refresh.sql"
          pnpm exec wrangler d1 execute AUTH_DB --config wrangler.production.json --remote \
            --file "$RUNNER_TEMP/production-refresh.sql" --yes
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.production.json --remote \
            --output "$RUNNER_TEMP/current-production-auth.sql" --skip-confirmation
          python3 scripts/verifyAuthMirror.py drizzle-auth/0000_curly_gambit.sql \
            "$RUNNER_TEMP/cutover-auth/auth.sql" "$RUNNER_TEMP/current-production-auth.sql" \
            "$RUNNER_TEMP/previous-production-auth.sql"
      - name: Replace stale product import with final Postgres data
        if: steps.cutover.outputs.needed == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_OWNER_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_IMPORT_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
          PRODUCTION_SPACETIME_OPERATOR_ID: ${{ vars.PRODUCTION_SPACETIME_OPERATOR_ID }}
        run: |
          set -euo pipefail
          bash scripts/verifyCutoverFreeze.sh
          status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --request DELETE "${SPACETIME_URL%/}/v1/database/praetorium-production")"
          [[ "$status" == 200 || "$status" == 204 || "$status" == 404 ]]
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/octet-stream' \
            --request PUT --data-binary @spacetimedb/dist/bundle.js \
            "${SPACETIME_URL%/}/v1/database/praetorium-production?host_type=Js"
          jq -nc --arg operator "$PRODUCTION_SPACETIME_OPERATOR_ID" \
            '["https://praetorium.gg/api/auth", "praetorium-production", $operator]' \
            > "$RUNNER_TEMP/production-configure.json"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' --request POST \
            --data-binary @"$RUNNER_TEMP/production-configure.json" \
            "${SPACETIME_URL%/}/v1/database/praetorium-production/call/configure"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_OPERATOR_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' --request POST --data-binary '[]' \
            "${SPACETIME_URL%/}/v1/database/praetorium-production/call/operator_health"
          pnpm product:import "$RUNNER_TEMP/cutover-product" "$SPACETIME_URL" praetorium-production
      - name: Verify public objects in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp s3://praetorium-catalogue/praetorium/current.json "$RUNNER_TEMP/r2-current.json" \
            --endpoint-url "$endpoint" --only-show-errors
          id="$(jq -er '.id | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/r2-current.json")"
          expected="$(jq -er '.archiveSha256 | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/r2-current.json")"
          aws s3 cp "s3://praetorium-catalogue/praetorium/snapshots/$id.zip" "$RUNNER_TEMP/r2-catalogue.zip" \
            --endpoint-url "$endpoint" --only-show-errors
          test "$(sha256sum "$RUNNER_TEMP/r2-catalogue.zip" | cut -d ' ' -f 1)" = "$expected"
          aws s3api head-object --bucket praetorium-catalogue --key praetorium/revocations.json \
            --endpoint-url "$endpoint" > /dev/null
          images="$(pnpm exec wrangler d1 execute AUTH_DB --config wrangler.production.json --remote \
            --command 'SELECT image FROM "user" WHERE image IS NOT NULL' --json)"
          count=0
          while IFS= read -r url; do
            if [[ ! "$url" =~ ^https://s3[.]praetorium[.]gg/praetorium/(avatars/[0-9a-f]{64}[.](jpg|png|webp))$ ]]; then
              echo 'An imported profile image has no R2 object key' >&2
              exit 1
            fi
            aws s3api head-object --bucket praetorium-catalogue --key "praetorium/${BASH_REMATCH[1]}" \
              --endpoint-url "$endpoint" > /dev/null
            count=$((count + 1))
          done < <(jq -r '.[0].results[].image // empty' <<< "$images")
          echo "Verified catalogue archive and $count profile images in R2"
      - name: Prepare production Worker deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_OWNER_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
          RELEASE_SHA: ${{ needs.release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SPACETIME_URL"
          test -n "$SPACETIME_OWNER_TOKEN"
          test -n "$SPACETIME_OPERATOR_TOKEN"
          test -n "$SPACETIME_ACCESS_CLIENT_ID"
          test -n "$SPACETIME_ACCESS_CLIENT_SECRET"
          test -n "$AUTH_SECRET"
          test -n "$APPLE_CLIENT_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_KEY_ID"
          test -n "$APPLE_PRIVATE_KEY"
          test -n "$SMTP_HOST"
          test -n "$SMTP_PORT"
          test -n "$SMTP_USER"
          test -n "$SMTP_PASSWORD"
          test -n "$EMAIL_FROM"
          test -n "$EXPO_PUSH_ACCESS_TOKEN"
          auth_count="$(pnpm exec wrangler d1 execute AUTH_DB --config wrangler.production.json --remote \
            --command 'SELECT COUNT(*) AS count FROM "user"' --json | jq -er '.[0].results[0].count | select(type == "number" and . > 0)')"
          roster_count="$(curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: text/plain' \
            --request POST --data-binary 'SELECT COUNT(*) AS count FROM rosters' \
            "${SPACETIME_URL%/}/v1/database/praetorium-production/sql" \
            | jq -er '.[0].rows[0][0] | select(type == "number" and . > 0)')"
          echo "Migrated production data present: $auth_count users, $roster_count rosters"
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/octet-stream' \
            --request PUT --data-binary @spacetimedb/dist/bundle.js \
            "${SPACETIME_URL%/}/v1/database/praetorium-production?host_type=Js"
          snapshot_id="$(jq -r .snapshotId .output/worker-catalogue/manifest.json)"
          manifest_sha="$(sha256sum .output/worker-catalogue/manifest.json | cut -d ' ' -f 1)"
          jq --arg main "$GITHUB_WORKSPACE/cloudflare/nativeWorker.ts" \
            --arg assets "$GITHUB_WORKSPACE/.output/public" \
            --arg snapshot "$snapshot_id" --arg manifest "$manifest_sha" --arg revision "$RELEASE_SHA" \
            '.main = $main | .assets.directory = $assets | .vars.CATALOGUE_SNAPSHOT_ID = $snapshot | .vars.CATALOGUE_MANIFEST_SHA256 = $manifest | .vars.GITHUB_SHA = $revision' \
            wrangler.production.json > "$RUNNER_TEMP/wrangler-production.json"
          jq -n --arg auth "$AUTH_SECRET" --arg spacetime "$SPACETIME_URL" \
            --arg operator "$SPACETIME_OPERATOR_TOKEN" \
            --arg access_id "$SPACETIME_ACCESS_CLIENT_ID" --arg access_secret "$SPACETIME_ACCESS_CLIENT_SECRET" \
            --arg apple_client "$APPLE_CLIENT_ID" --arg apple_team "$APPLE_TEAM_ID" \
            --arg apple_key "$APPLE_KEY_ID" --arg apple_private "$APPLE_PRIVATE_KEY" \
            --arg google_client "$GOOGLE_CLIENT_ID" --arg google_secret "$GOOGLE_CLIENT_SECRET" \
            --arg discord_client "$DISCORD_CLIENT_ID" --arg discord_secret "$DISCORD_CLIENT_SECRET" \
            --arg smtp_host "$SMTP_HOST" \
            --arg smtp_port "$SMTP_PORT" --arg smtp_secure "$SMTP_SECURE" \
            --arg smtp_user "$SMTP_USER" --arg smtp_password "$SMTP_PASSWORD" \
            --arg email_from "$EMAIL_FROM" --arg expo_push "$EXPO_PUSH_ACCESS_TOKEN" \
            '{AUTH_SECRET: $auth, SPACETIME_URL: $spacetime, SPACETIME_OPERATOR_TOKEN: $operator, SPACETIME_ACCESS_CLIENT_ID: $access_id, SPACETIME_ACCESS_CLIENT_SECRET: $access_secret, APPLE_CLIENT_ID: $apple_client, APPLE_TEAM_ID: $apple_team, APPLE_KEY_ID: $apple_key, APPLE_PRIVATE_KEY: $apple_private, GOOGLE_CLIENT_ID: $google_client, GOOGLE_CLIENT_SECRET: $google_secret, DISCORD_CLIENT_ID: $discord_client, DISCORD_CLIENT_SECRET: $discord_secret, SMTP_HOST: $smtp_host, SMTP_PORT: $smtp_port, SMTP_SECURE: $smtp_secure, SMTP_USER: $smtp_user, SMTP_PASSWORD: $smtp_password, EMAIL_FROM: $email_from, EXPO_PUSH_ACCESS_TOKEN: $expo_push}' \
            > "$RUNNER_TEMP/wrangler-production-secrets.json"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-production.json" --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Mark production route attempt
        id: route_attempt
        run: echo 'attempted=true' >> "$GITHUB_OUTPUT"
      - name: Deploy production Worker routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-production.json" \
            --secrets-file "$RUNNER_TEMP/wrangler-production-secrets.json" \
            --route 'praetorium.gg/*' --route 's3.praetorium.gg/*' --route 'catalogue.praetorium.gg/*'
      - name: Verify production revision
        env:
          EXPECTED_REVISION: ${{ needs.release.outputs.sha || github.sha }}
        run: |
          for _ in {1..60}; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-time 10 https://praetorium.gg/api/health | tr -d '\r' || true)"
            revision="$(awk 'tolower($1) == "x-praetorium-revision:" { print $2 }' <<< "$headers")"
            if [[ "$revision" == "$EXPECTED_REVISION" ]] && grep -Eiq '^x-praetorium-runtime: cloudflare$' <<< "$headers"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not serve revision $EXPECTED_REVISION" >&2
          exit 1

      - name: Verify public object routes
        run: |
          set -euo pipefail
          for host in s3.praetorium.gg catalogue.praetorium.gg; do
            ready=false
            for _ in {1..12}; do
              if curl --fail --silent --show-error --max-time 20 \
                --dump-header "$RUNNER_TEMP/$host.headers" \
                --output "$RUNNER_TEMP/$host.json" \
                "https://$host/praetorium/current.json" \
                && grep -Eiq '^x-praetorium-object-source: r2' "$RUNNER_TEMP/$host.headers" \
                && jq -e '.id | test("^[0-9a-f]{64}$")' "$RUNNER_TEMP/$host.json" > /dev/null; then
                ready=true
                break
              fi
              sleep 5
            done
            test "$ready" = true
          done
      - name: Restore previous application if cutover failed before routing
        if: failure() && steps.cutover.outputs.needed == 'true' && steps.route_attempt.outputs.attempted != 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: bash scripts/restartDokployBeforeCloudflare.sh

  retire-dokploy-runtime:
    needs: [cloudflare-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stop replaced production and staging services
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: bash scripts/retireDokployRuntime.sh
