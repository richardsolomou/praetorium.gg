name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v2
    with:
      validation-workflow: ci.yml
    secrets: inherit

  production-image:
    if: needs.release.outputs.created == 'true' && vars.CLOUDFLARE_WORKER_DEPLOY != 'true'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Build and publish production image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v1
        with:
          image: ghcr.io/${{ github.repository }}
          sha: ${{ needs.release.outputs.sha }}
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            GITHUB_ACTIONS=true
            GITHUB_SHA=${{ needs.release.outputs.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SERVER_URL=${{ github.server_url }}
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
      - name: Deploy production image
        if: vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
      - name: Verify production deployment
        if: vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        env:
          EXPECTED_REVISION: ${{ needs.release.outputs.sha }}
        run: |
          for attempt in {1..60}; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-time 10 https://praetorium.gg/api/health || true)"
            revision="$(awk 'tolower($1) == "x-praetorium-revision:" { gsub("\\r", "", $2); print $2 }' <<< "$headers")"
            if [[ "$revision" == "$EXPECTED_REVISION" ]]; then
              echo "Production is serving $EXPECTED_REVISION"
              exit 0
            fi
            echo "Waiting for production revision $EXPECTED_REVISION ($attempt/60)"
            sleep 10
          done
          echo "Production did not serve revision $EXPECTED_REVISION within 10 minutes" >&2
          exit 1

  cloudflare-production:
    if: (needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch') && vars.CLOUDFLARE_WORKER_DEPLOY == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Fetch verified catalogue
        run: pnpm catalogue:sync
      - name: Build native Worker
        env:
          NITRO_PRESET: cloudflare_module
          GITHUB_SHA: ${{ needs.release.outputs.sha || github.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: pnpm build
      - name: Install verified catalogue assets
        run: |
          pnpm catalogue:worker
          pnpm catalogue:worker:assets
      - name: Build SpacetimeDB module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
      - name: Publish product module and deploy application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_OWNER_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          RELEASE_SHA: ${{ needs.release.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$SPACETIME_URL"
          test -n "$SPACETIME_OWNER_TOKEN"
          test -n "$SPACETIME_OPERATOR_TOKEN"
          test -n "$SPACETIME_ACCESS_CLIENT_ID"
          test -n "$SPACETIME_ACCESS_CLIENT_SECRET"
          test -n "$AUTH_SECRET"
          test -n "$APPLE_CLIENT_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_KEY_ID"
          test -n "$APPLE_PRIVATE_KEY"
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/octet-stream' \
            --request PUT --data-binary @spacetimedb/dist/bundle.js \
            "${SPACETIME_URL%/}/v1/database/praetorium-production?host_type=Js"
          snapshot_id="$(jq -r .snapshotId .output/worker-catalogue/manifest.json)"
          manifest_sha="$(sha256sum .output/worker-catalogue/manifest.json | cut -d ' ' -f 1)"
          jq --arg main "$GITHUB_WORKSPACE/cloudflare/nativeWorker.ts" \
            --arg assets "$GITHUB_WORKSPACE/.output/public" \
            --arg snapshot "$snapshot_id" --arg manifest "$manifest_sha" --arg revision "$RELEASE_SHA" \
            '.main = $main | .assets.directory = $assets | .vars.CATALOGUE_SNAPSHOT_ID = $snapshot | .vars.CATALOGUE_MANIFEST_SHA256 = $manifest | .vars.GITHUB_SHA = $revision' \
            wrangler.production.json > "$RUNNER_TEMP/wrangler-production.json"
          jq -n --arg auth "$AUTH_SECRET" --arg spacetime "$SPACETIME_URL" \
            --arg operator "$SPACETIME_OPERATOR_TOKEN" \
            --arg access_id "$SPACETIME_ACCESS_CLIENT_ID" --arg access_secret "$SPACETIME_ACCESS_CLIENT_SECRET" \
            --arg apple_client "$APPLE_CLIENT_ID" --arg apple_team "$APPLE_TEAM_ID" \
            --arg apple_key "$APPLE_KEY_ID" --arg apple_private "$APPLE_PRIVATE_KEY" \
            --arg google_client "$GOOGLE_CLIENT_ID" --arg google_secret "$GOOGLE_CLIENT_SECRET" \
            --arg discord_client "$DISCORD_CLIENT_ID" --arg discord_secret "$DISCORD_CLIENT_SECRET" \
            '{AUTH_SECRET: $auth, SPACETIME_URL: $spacetime, SPACETIME_OPERATOR_TOKEN: $operator, SPACETIME_ACCESS_CLIENT_ID: $access_id, SPACETIME_ACCESS_CLIENT_SECRET: $access_secret, APPLE_CLIENT_ID: $apple_client, APPLE_TEAM_ID: $apple_team, APPLE_KEY_ID: $apple_key, APPLE_PRIVATE_KEY: $apple_private, GOOGLE_CLIENT_ID: $google_client, GOOGLE_CLIENT_SECRET: $google_secret, DISCORD_CLIENT_ID: $discord_client, DISCORD_CLIENT_SECRET: $discord_secret}' \
            > "$RUNNER_TEMP/wrangler-production-secrets.json"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-production.json" --dry-run --outdir "$RUNNER_TEMP/worker"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-production.json" \
            --secrets-file "$RUNNER_TEMP/wrangler-production-secrets.json" --route 'praetorium.gg/*'
      - name: Verify production revision
        env:
          EXPECTED_REVISION: ${{ needs.release.outputs.sha || github.sha }}
        run: |
          for attempt in {1..60}; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-time 10 https://praetorium.gg/api/health || true)"
            revision="$(awk 'tolower($1) == "x-praetorium-revision:" { gsub("\\r", "", $2); print $2 }' <<< "$headers")"
            if [[ "$revision" == "$EXPECTED_REVISION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not serve revision $EXPECTED_REVISION" >&2
          exit 1
