name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    secrets: inherit

  # Pull requests run only the specs their change exercises; the merged commit runs them all before it ships.
  e2e-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the merged commit's browser suite
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$run" ]; then
              job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.name == "e2e")][0] // {} | "\(.status // "pending") \(.conclusion // "")"')"
              case "$job" in
                'completed success' | 'completed skipped') echo "The browser suite passed for $SHA"; exit 0 ;;
                completed*) echo "::error::The browser suite for $SHA ended ${job#completed }, so it does not deploy"; exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::The browser suite for $SHA did not finish within an hour"
          exit 1

  dokploy-production:
    needs: [release, e2e-gate]
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/dokploy-web.yml
    with:
      environment: production
      revision: ${{ needs.release.outputs.sha || github.sha }}
    secrets: inherit

  after-release:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || github.sha }}
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Check iOS delivery inputs
        id: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING_IOS_REVISIONS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile.yml/runs?branch=main&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[] | select(.status != "completed") | .display_title | try capture("^iOS delivery (?<sha>[0-9a-f]{40})$").sha]')"
          base_revision="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=mobile-ios-stable&per_page=1" --jq '.[0].sha // ""')"
          export PENDING_IOS_REVISIONS
          pnpm exec tsx scripts/iosDelivery.ts "${base_revision:-0000000000000000000000000000000000000000}" HEAD
      - name: Deliver changed iOS application
        if: steps.ios.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.release.outputs.sha || github.sha }}
        run: gh workflow run mobile.yml --repo "$GITHUB_REPOSITORY" --ref main -f revision="$RELEASE_REVISION" -f force_build=false
      - name: Refresh the release coverage baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run coverage-baseline.yml --repo "$GITHUB_REPOSITORY" --ref main
