name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v1
    secrets: inherit

  dokploy-production:
    needs: [release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dokploy-web.yml
    with:
      environment: production
      revision: ${{ needs.release.outputs.sha || github.sha }}
    secrets: inherit

  # The release commit skips push workflows, so the ones it must still run are started here.
  after-release:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run mobile.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run coverage-baseline.yml --repo "$GITHUB_REPOSITORY" --ref main
