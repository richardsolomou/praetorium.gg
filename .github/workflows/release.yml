name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.44.0
    secrets: inherit

  production-image:
    if: needs.release.outputs.created == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Build and publish production image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v0.47.0
        with:
          image: ghcr.io/${{ github.repository }}
          sha: ${{ needs.release.outputs.sha }}
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      - name: Deploy production image
        if: vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v0.47.0
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
