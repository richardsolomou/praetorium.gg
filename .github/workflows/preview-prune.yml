name: PR preview prune

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

jobs:
  previews:
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: richardsolomou/ras-stack/.github/workflows/prune-dokploy-previews.yml@v0.47.2
    with:
      package: praetorium.gg
      application-prefix: praetorium
      domain: praetorium.gg
      port: 3000
      # Same script as the deploy, so there is one implementation of the lifecycle.
      deploy-script: scripts/previewDeploy.ts
    secrets: inherit
