name: PR preview prune

# Cleanup already runs when a pull request closes; this is what catches the ones
# where that failed, so a preview cannot outlive its branch by more than a week.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.35.0
      - name: List open pull requests
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "numbers=$(gh pr list --state open --limit 1000 --json number --jq '.[].number' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Prune previews without open pull requests
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          OPEN_PR_NUMBERS: ${{ steps.open.outputs.numbers }}
        run: pnpm exec tsx scripts/previewDeploy.ts prune
      - name: Prune preview images
        uses: richardsolomou/ras-stack/actions/prune-preview-images@v0.36.0
        with:
          token: ${{ github.token }}
          package: praetorium.gg
          open-pr-numbers: ${{ steps.open.outputs.numbers }}
