name: Coverage baseline

# Pull request caches are scoped to their own branch, so only a snapshot saved from
# main can serve as the coverage base for every pull request that follows it. The
# release run dispatches this once main settles, after any `[skip ci]` release commit.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Matches the base parts in the CI coverage job.
        include:
          - file: base-0.json
            part: 0/2
          - file: base-1.json
            part: 1/2
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      - name: Restore the snapshot
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.file }}
          # Matches the base key in the CI coverage job.
          key: catalogue-coverage-${{ github.sha }}-${{ matrix.file }}-${{ hashFiles('catalogue-data/.snapshot.json') }}
      - name: Snapshot main
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm catalogue:coverage:parallel ${{ matrix.file }} --part ${{ matrix.part }}
