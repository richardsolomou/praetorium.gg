name: Mobile iOS delivery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile.yml
      - fastlane/**
      - Gemfile
      - Gemfile.lock
      - mobile/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: mobile-ios-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    name: Deliver iOS
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.11
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Expose Fastlane to EAS local builds
        env:
          BUNDLE_BIN: ${{ runner.temp }}/bundle-bin
        run: |
          bundle binstubs fastlane
          echo "$BUNDLE_BIN" >> "$GITHUB_PATH"
      - name: Create the App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build the canary iOS application
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build-canary
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-build"
          pnpm dlx eas-cli@23.2.0 build --platform ios --profile canary-ios --local --output "$RUNNER_TEMP/mobile-build/praetorium-canary.ipa" --freeze-credentials --non-interactive
      - name: Upload the canary iOS application
        run: bundle exec fastlane ios upload ipa:"$RUNNER_TEMP/mobile-build/praetorium-canary.ipa"
      - name: Publish the compatible canary update
        env:
          EAS_ENVIRONMENT: preview
          MOBILE_UPDATE_CHANNEL: canary
          POSTHOG_CLI_DRY_RUN: 'true'
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 update --platform ios --channel "$MOBILE_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --message "$GITHUB_SHA" --non-interactive
      - name: Remove the canary build workspace
        run: rm -rf "${RUNNER_TEMP:?}/eas-local-build-canary"
      - name: Build the stable iOS application
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build-stable
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 build --platform ios --profile production --local --output "$RUNNER_TEMP/mobile-build/praetorium-stable.ipa" --freeze-credentials --non-interactive
      - name: Upload the stable iOS application
        run: bundle exec fastlane ios upload ipa:"$RUNNER_TEMP/mobile-build/praetorium-stable.ipa"
      - name: Publish the compatible stable update
        env:
          EAS_ENVIRONMENT: production
          MOBILE_UPDATE_CHANNEL: stable
          POSTHOG_CLI_DRY_RUN: 'false'
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 update --platform ios --channel "$MOBILE_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --message "$GITHUB_SHA" --non-interactive
      - name: Sync App Store metadata
        env:
          EXPO_APPLE_TEAM_ID: A3X8464573
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 metadata:push --profile production --non-interactive
      - name: Store Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics
          path: |
            ${{ runner.temp }}/eas-local-build-*/**/*.xcresult
            ${{ runner.temp }}/eas-local-build-*/**/*.log
            ~/Library/Logs/gym
          retention-days: 7
          if-no-files-found: ignore
