name: Mobile iOS delivery
run-name: iOS delivery ${{ inputs.revision || github.sha }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to build; defaults to the selected branch revision
        type: string
        default: ''
      provision_watch:
        description: Register and provision the Watch target using the existing iPhone distribution certificate
        type: boolean
        default: false

concurrency:
  group: mobile-ios-delivery
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deliver:
    name: Deliver iOS
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 360
    env:
      MOBILE_REVISION: ${{ inputs.revision || github.sha }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      EXPO_APPLE_TEAM_ID: A3X8464573
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      EXPO_NO_CAPABILITY_SYNC: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.MOBILE_REVISION }}
          fetch-depth: 0
      - name: Resolve the mobile revision
        run: echo "MOBILE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Expose Fastlane to EAS local builds
        env:
          BUNDLE_BIN: ${{ runner.temp }}/bundle-bin
        run: |
          bundle binstubs fastlane
          echo "$BUNDLE_BIN" >> "$GITHUB_PATH"
      - name: Create the App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APP_STORE_CONNECT_KEY_PATH=$key_path"
            echo "EXPO_ASC_API_KEY_PATH=$key_path"
            echo "EXPO_ASC_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - name: Provision the Watch signing profile
        if: github.event_name == 'workflow_dispatch' && inputs.provision_watch
        run: pnpm --package=eas-cli@23.2.0 dlx -c 'node scripts/provisionWatchIos.js'
      - name: Build the canary iOS application
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build-canary
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/mobile-build"
          pnpm dlx eas-cli@23.2.0 build --platform ios --profile canary-ios --local --output "$RUNNER_TEMP/mobile-build/praetorium-canary.ipa" --freeze-credentials --non-interactive
      - name: Upload the canary iOS application
        run: bundle exec fastlane ios upload ipa:"$RUNNER_TEMP/mobile-build/praetorium-canary.ipa"
      - name: Publish the compatible canary update
        if: github.ref == 'refs/heads/main'
        env:
          EAS_ENVIRONMENT: preview
          MOBILE_UPDATE_CHANNEL: canary
          POSTHOG_CLI_DRY_RUN: 'true'
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 update --platform ios --channel "$MOBILE_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --message "$MOBILE_REVISION" --non-interactive
      - name: Remove the canary build workspace
        run: rm -rf "${RUNNER_TEMP:?}/eas-local-build-canary"
      - name: Build the stable iOS application
        if: github.ref == 'refs/heads/main'
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build-stable
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 build --platform ios --profile production --local --output "$RUNNER_TEMP/mobile-build/praetorium-stable.ipa" --freeze-credentials --non-interactive
      - name: Upload the stable iOS application
        if: github.ref == 'refs/heads/main'
        run: bundle exec fastlane ios upload ipa:"$RUNNER_TEMP/mobile-build/praetorium-stable.ipa"
      - name: Publish the compatible stable update
        if: github.ref == 'refs/heads/main'
        env:
          EAS_ENVIRONMENT: production
          MOBILE_UPDATE_CHANNEL: stable
          POSTHOG_CLI_DRY_RUN: 'false'
        working-directory: mobile
        run: pnpm dlx eas-cli@23.2.0 update --platform ios --channel "$MOBILE_UPDATE_CHANNEL" --environment "$EAS_ENVIRONMENT" --message "$MOBILE_REVISION" --non-interactive
      - name: Sync App Store metadata
        if: github.ref == 'refs/heads/main'
        working-directory: mobile
        run: |
          jq --arg path "$APP_STORE_CONNECT_KEY_PATH" --arg id "$APP_STORE_CONNECT_KEY_ID" --arg issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            '.submit.production.ios += {ascApiKeyPath: $path, ascApiKeyId: $id, ascApiKeyIssuerId: $issuer}' \
            eas.json > eas.json.tmp
          mv eas.json.tmp eas.json
          pnpm dlx eas-cli@23.2.0 metadata:push --profile production --non-interactive
      - name: Store Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-diagnostics
          path: |
            ${{ runner.temp }}/eas-local-build-*/**/*.xcresult
            ${{ runner.temp }}/eas-local-build-*/**/*.log
            ~/Library/Logs/gym
          retention-days: 7
          if-no-files-found: ignore
      - name: Record the delivered iOS revision
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id="$(jq -n --arg revision "$MOBILE_REVISION" '{ref: $revision, environment: "mobile-ios-stable", auto_merge: false, required_contexts: [], production_environment: true}' | gh api "repos/$GITHUB_REPOSITORY/deployments" --method POST --input - --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --method POST -f state=success -f environment_url=https://praetorium.gg -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
