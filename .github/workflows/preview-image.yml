name: Preview image

on:
  pull_request:

concurrency:
  group: preview-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: "!startsWith(github.head_ref, 'release-candidate/')"
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@v1
    with:
      package: praetorium.gg
      local-image: praetorium.gg
      domain: praetorium.gg
      marker: <!-- praetorium-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      # Shared with the E2E image build so pull requests warm one cache.
      cache-scope: e2e-image
