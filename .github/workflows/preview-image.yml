name: Preview image

on:
  pull_request:

concurrency:
  group: preview-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mark-deploying:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/report-preview-status.yml@v0.47.0
    with:
      state: building
      pr-number: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      preview-url: https://pr-${{ github.event.pull_request.number }}.praetorium.gg
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      marker: <!-- praetorium-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the preview image
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ghcr.io/${{ github.repository_owner }}/praetorium.gg:preview-pr-${{ github.event.pull_request.number }}-sha-${{ github.event.pull_request.head.sha }}
          push: true
          cache-from: type=gha,scope=e2e-image
      - name: Build the fork preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: praetorium.gg:preview-pr-${{ github.event.pull_request.number }}-sha-${{ github.event.pull_request.head.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/preview-image.tar
          cache-from: type=gha,scope=e2e-image
      - name: Store the fork preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: preview-image-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
