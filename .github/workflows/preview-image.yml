name: Preview image

on:
  pull_request:

concurrency:
  group: preview-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: startsWith(github.head_ref, 'release-candidate/') == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the E2E image without deployment credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker build --build-arg GITHUB_SHA="$PREVIEW_SHA" \
            --tag "praetorium.gg:preview-pr-$PR_NUMBER-sha-$PREVIEW_SHA" .
      - name: Publish internal image
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/praetorium.gg:preview-pr-$PR_NUMBER-sha-$PREVIEW_SHA"
          docker tag "praetorium.gg:preview-pr-$PR_NUMBER-sha-$PREVIEW_SHA" "$image"
          docker push "$image"
