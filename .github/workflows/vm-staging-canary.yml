name: VM staging canary

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: vm-staging-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'vm-canary-deploy'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
      - name: Build and publish Node canary image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v1
        with:
          image: ghcr.io/${{ github.repository }}-node
          sha: ${{ env.REVISION }}
          release-tag: canary
          token: ${{ github.token }}
          dockerfile: Dockerfile.node
          build-args: |
            GITHUB_SHA=${{ env.REVISION }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          cache-scope: vm-canary-image
      - name: Verify Dokploy can pull the image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect --raw "$IMAGE" > /dev/null
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Build SpacetimeDB module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
      - name: Publish isolated canary database
        env:
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_OPERATOR_ID: ${{ vars.STAGING_SPACETIME_OPERATOR_ID }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.STAGING_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$SPACETIME_URL"
          test -n "$SPACETIME_ADMIN_TOKEN"
          test -n "$SPACETIME_OPERATOR_ID"
          test -n "$SPACETIME_OPERATOR_TOKEN"
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $SPACETIME_ADMIN_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/octet-stream' \
            --request PUT --data-binary @spacetimedb/dist/bundle.js \
            "${SPACETIME_URL%/}/v1/database/praetorium-vm-staging?host_type=Js"
          jq -nc --arg operator "$SPACETIME_OPERATOR_ID" \
            '["https://vm-staging.praetorium.gg/api/auth", "praetorium-vm-staging", $operator]' \
            > "$RUNNER_TEMP/vm-staging-configure.json"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_ADMIN_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' \
            --request POST --data-binary @"$RUNNER_TEMP/vm-staging-configure.json" \
            "${SPACETIME_URL%/}/v1/database/praetorium-vm-staging/call/configure"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_OPERATOR_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' \
            --request POST --data-binary '[]' \
            "${SPACETIME_URL%/}/v1/database/praetorium-vm-staging/call/operator_health"
      - name: Configure Dokploy canary credentials
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.STAGING_SPACETIME_OPERATOR_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto'

          const applicationId = 'HBfSup0NWyUKq5Paar-63'
          const origin = new URL(process.env.DOKPLOY_URL)
          if (origin.protocol !== 'https:' || !process.env.DOKPLOY_API_KEY || !process.env.SPACETIME_OPERATOR_TOKEN) {
            throw new Error('Dokploy canary credentials are missing')
          }
          const headers = { 'x-api-key': process.env.DOKPLOY_API_KEY }
          const inspect = async () => {
            const url = new URL('/api/application.one', origin)
            url.searchParams.set('applicationId', applicationId)
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(30_000) })
            if (!response.ok) throw new Error(`Dokploy application read failed: HTTP ${response.status}`)
            return response.json()
          }
          const application = await inspect()
          if (application.applicationId !== applicationId || application.name !== 'vm-canary' || typeof application.env !== 'string') {
            throw new Error('Unexpected Dokploy canary application')
          }
          const variables = application.env.split('\n').filter(Boolean)
          const authIndex = variables.findIndex((line) => line.startsWith('AUTH_SECRET='))
          if (authIndex === -1) variables.push(`AUTH_SECRET=${randomBytes(32).toString('hex')}`)
          else if (variables[authIndex] === 'AUTH_SECRET=') variables[authIndex] = `AUTH_SECRET=${randomBytes(32).toString('hex')}`
          const operator = `SPACETIME_OPERATOR_TOKEN=${process.env.SPACETIME_OPERATOR_TOKEN}`
          const operatorIndex = variables.findIndex((line) => line.startsWith('SPACETIME_OPERATOR_TOKEN='))
          if (operatorIndex === -1) variables.push(operator)
          else variables[operatorIndex] = operator
          const env = variables.join('\n')
          const response = await fetch(new URL('/api/application.saveEnvironment', origin), {
            method: 'POST',
            headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ applicationId, env, buildArgs: application.buildArgs ?? null, buildSecrets: application.buildSecrets ?? null, createEnvFile: false }),
            signal: AbortSignal.timeout(30_000),
          })
          if (!response.ok) throw new Error(`Dokploy environment save failed: HTTP ${response.status}`)
          const saved = await inspect()
          if (saved.env !== env) throw new Error('Dokploy canary credentials did not persist')
          NODE
      - name: Deploy published canary image
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: HBfSup0NWyUKq5Paar-63
          image: ${{ steps.image.outputs.reference }}
      - name: Export staging auth for the web rehearsal
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.staging.json --remote \
            --skip-confirmation --output "$RUNNER_TEMP/staging-auth.sql"
          node scripts/nodeAuthSqlite.ts upload-r2 "$RUNNER_TEMP/staging-auth.sql" staging \
            > "$RUNNER_TEMP/staging-auth-export.json"
          key="$(jq -er .key "$RUNNER_TEMP/staging-auth-export.json")"
          echo "AUTH_IMPORT_R2_KEY=$key" >> "$GITHUB_ENV"
          jq '{key, counts}' "$RUNNER_TEMP/staging-auth-export.json"
      - name: Configure staging web from the verified auth export
        if: github.event_name == 'workflow_dispatch'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_STAGING_WEB_APP_ID }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.STAGING_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: node scripts/configureDokployNode.ts configure staging
      - name: Deploy staging web rehearsal
        if: github.event_name == 'workflow_dispatch'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ vars.DOKPLOY_STAGING_WEB_APP_ID }}
          image: ${{ steps.image.outputs.reference }}
