name: Dokploy preview deploy

on:
  workflow_run:
    workflows: [Dokploy preview image]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  approve-fork:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    environment: pr-preview
    steps:
      - run: true

  deploy:
    needs: approve-fork
    if: always() && (needs.approve-fork.result == 'success' || needs.approve-fork.result == 'skipped') && (github.event_name == 'pull_request_target' || github.event.workflow_run.pull_requests[0]) && !startsWith(github.event.workflow_run.head_branch || github.event.pull_request.head.ref, 'release-candidate/')
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v1
    with:
      package: praetorium.gg
      local-image: praetorium-preview
      application-prefix: praetorium
      domain: praetorium.gg
      subdomain-prefix: pr
      cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      port: 3000
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      deploy-script: scripts/dokployPreview.ts
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
      PREVIEW_APP_SECRETS: ${{ format('{{"SPACETIME_URL":"{0}","SPACETIME_ADMIN_TOKEN":"{1}","SPACETIME_ACCESS_CLIENT_ID":"{2}","SPACETIME_ACCESS_CLIENT_SECRET":"{3}","SPACETIME_INTERNAL_HOST":"{4}"}}', vars.SPACETIME_URL, secrets.SPACETIME_ADMIN_TOKEN, secrets.SPACETIME_ACCESS_CLIENT_ID, secrets.SPACETIME_ACCESS_CLIENT_SECRET, vars.STAGING_SPACETIME_INTERNAL_HOST) }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRAETORIUM_PREVIEW_DNS_API_TOKEN }}
