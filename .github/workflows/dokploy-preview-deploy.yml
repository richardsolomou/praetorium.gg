name: Dokploy preview deploy

on:
  workflow_run:
    workflows: [Dokploy preview image]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      built: ${{ steps.image.outputs.built }}
    steps:
      - name: Check whether an image was built
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          built=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '
            [.jobs[] | select(.name == "build" or (.name | startswith("build /")))] |
            if length == 0 then error("missing preview build job")
            else any(.[]; .conclusion != "skipped") end')
          echo "built=$built" >> "$GITHUB_OUTPUT"

  # A branch of this repository builds a preview only when a maintainer labels it. A fork's pull request runs its own copy of
  # the image workflow, which could build on every push, so its preview also waits for a maintainer here.
  approve:
    needs: image
    if: needs.image.outputs.built == 'true' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    environment: pr-preview
    steps:
      - run: true

  deploy:
    needs: [image, approve]
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') && (github.event_name == 'pull_request_target' || (github.event.workflow_run.pull_requests[0] && (github.event.workflow_run.status != 'completed' || needs.image.outputs.built == 'true')))
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@85eed28b904224b2b118b4691fcaac87c4984b29
    with:
      package: praetorium.gg
      # Pulls the arm64 preview image and extracts its database module natively.
      runner: ubuntu-24.04-arm
      local-image: praetorium-preview
      application-prefix: praetorium
      domain: praetorium.gg
      subdomain-prefix: pr
      cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      port: 3000
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      deploy-script: scripts/dokployPreview.ts
      dependabot-environment: ''
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
      PREVIEW_REGISTRY_USERNAME: ${{ github.repository_owner }}
      PREVIEW_REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
      # The catalogue read key reaches only the catalogue bucket, read-only, so preview code never holds a key to players' data.
      PREVIEW_APP_SECRETS: ${{ format('{{"SPACETIME_URL":"{0}","SPACETIME_ADMIN_TOKEN":"{1}","SPACETIME_ACCESS_CLIENT_ID":"{2}","SPACETIME_ACCESS_CLIENT_SECRET":"{3}","SPACETIME_INTERNAL_HOST":"{4}","SNAPSHOT_R2_ACCOUNT_ID":"{5}","SNAPSHOT_R2_ACCESS_KEY_ID":"{6}","SNAPSHOT_R2_SECRET_ACCESS_KEY":"{7}"}}', vars.SPACETIME_URL, secrets.SPACETIME_ADMIN_TOKEN, secrets.SPACETIME_ACCESS_CLIENT_ID, secrets.SPACETIME_ACCESS_CLIENT_SECRET, vars.STAGING_SPACETIME_INTERNAL_HOST, vars.CLOUDFLARE_ACCOUNT_ID, secrets.R2_CATALOGUE_READ_ACCESS_KEY_ID, secrets.R2_CATALOGUE_READ_SECRET_ACCESS_KEY) }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRAETORIUM_PREVIEW_DNS_API_TOKEN }}
