name: Dokploy preview deploy

on:
  workflow_run:
    workflows: [Dokploy preview image]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      built: ${{ steps.image.outputs.built }}
    steps:
      - name: Check whether an image was built
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          built=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '
            [.jobs[] | select(.name == "build" or (.name | startswith("build /")))] |
            if length == 0 then error("missing preview build job")
            else any(.[]; .conclusion != "skipped") end')
          echo "built=$built" >> "$GITHUB_OUTPUT"

  approve-fork:
    needs: image
    if: needs.image.outputs.built == 'true' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    environment: pr-preview
    steps:
      - run: true

  deploy:
    needs: [image, approve-fork]
    if: always() && (needs.approve-fork.result == 'success' || needs.approve-fork.result == 'skipped') && (github.event_name == 'pull_request_target' || (github.event.workflow_run.pull_requests[0] && (github.event.workflow_run.status != 'completed' || needs.image.outputs.built == 'true')))
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@e4485fd0eddf67b197a5c2095012a956c784ff6e
    with:
      package: praetorium.gg
      # Pulls the arm64 preview image and extracts its database module natively.
      runner: ubuntu-24.04-arm
      local-image: praetorium-preview
      application-prefix: praetorium
      domain: praetorium.gg
      subdomain-prefix: pr
      cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      port: 3000
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      deploy-script: scripts/dokployPreview.ts
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
      PREVIEW_REGISTRY_USERNAME: ${{ github.repository_owner }}
      PREVIEW_REGISTRY_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN }}
      PREVIEW_APP_SECRETS: ${{ format('{{"SPACETIME_URL":"{0}","SPACETIME_ADMIN_TOKEN":"{1}","SPACETIME_ACCESS_CLIENT_ID":"{2}","SPACETIME_ACCESS_CLIENT_SECRET":"{3}","SPACETIME_INTERNAL_HOST":"{4}"}}', vars.SPACETIME_URL, secrets.SPACETIME_ADMIN_TOKEN, secrets.SPACETIME_ACCESS_CLIENT_ID, secrets.SPACETIME_ACCESS_CLIENT_SECRET, vars.STAGING_SPACETIME_INTERNAL_HOST) }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRAETORIUM_PREVIEW_DNS_API_TOKEN }}
