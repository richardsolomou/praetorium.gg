name: PR preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mark-deploying:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.8.0
      - name: Mark preview as deploying
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec tsx scripts/previewComment.ts building

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish preview image
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/praetorium.gg-preview:pr-${{ github.event.pull_request.number }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A fork's build never sees a secret, so its image travels as an artifact for
      # the trusted workflow to publish.
      - name: Build preview artifact
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: praetorium.gg-preview:${{ github.event.pull_request.head.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/preview-image.tar
          cache-from: type=gha
      - name: Store preview image
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: preview-image-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
