name: Catalogue update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: catalogue-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The same S3-compatible store the app now uploads profile pictures to, not
      # a catalogue-only credential: it publishes here and the app writes there.
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SNAPSHOT_BUCKET: ${{ vars.S3_BUCKET }}
      SNAPSHOT_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
      CATALOGUE_SNAPSHOT_FILE: /tmp/catalogue-snapshot.zip
      CATALOGUE_SNAPSHOT_POINTER_FILE: /tmp/catalogue-current.json
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.47.0
      # Baselines report here rather than fail. They measure agreement between sources this
      # job does not control, so an upstream addition trips one and holds every unrelated
      # part of the refresh back until two upstreams agree about a name again. A shortfall
      # lands in the run summary and the `points` job still enforces the same numbers on a
      # pull request, where a pinned snapshot makes a moved number our regression. Nothing
      # here relaxes integrity: an unresolvable upstream or an incomplete snapshot still
      # fails, as does the archive verification below.
      - name: Resolve and validate every upstream source
        env:
          CATALOGUE_BASELINES: report
        run: |
          pnpm catalogue:update
          pnpm catalogue:descriptions
          pnpm catalogue:points
      - name: Build and publish the immutable snapshot
        run: |
          test -n "$SNAPSHOT_BUCKET"
          test -n "$SNAPSHOT_ENDPOINT"
          test -n "$S3_PUBLIC_BASE_URL"
          pnpm catalogue:snapshot pack
          id="$(jq -r .id "$CATALOGUE_SNAPSHOT_POINTER_FILE")"
          aws s3api head-object --bucket "$SNAPSHOT_BUCKET" --key "snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" >/dev/null 2>&1 \
            || aws s3 cp "$CATALOGUE_SNAPSHOT_FILE" "s3://$SNAPSHOT_BUCKET/snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" --only-show-errors
          # The public URL can briefly lag the object store right after an upload, so a fresh
          # publish sometimes reads back stale bytes for a moment. Retry before failing the job.
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$S3_PUBLIC_BASE_URL/snapshots/$id.zip" --output /tmp/published-catalogue.zip \
              && CATALOGUE_SNAPSHOT_FILE=/tmp/published-catalogue.zip pnpm catalogue:snapshot verify; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "published catalogue snapshot still fails verification after $attempt attempts" >&2
              exit 1
            fi
            echo "published catalogue snapshot did not verify yet (attempt $attempt/5) — retrying"
            sleep 5
          done
          aws s3 cp "$CATALOGUE_SNAPSHOT_POINTER_FILE" "s3://$SNAPSHOT_BUCKET/current.json" \
            --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/json --cache-control no-store --only-show-errors
