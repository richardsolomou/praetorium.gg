name: Catalogue update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: catalogue-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The same S3-compatible store the app now uploads profile pictures to, not
      # a catalogue-only credential: it publishes here and the app writes there.
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SNAPSHOT_BUCKET: ${{ vars.S3_BUCKET }}
      SNAPSHOT_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
      CATALOGUE_SNAPSHOT_FILE: /tmp/catalogue-snapshot.zip
      CATALOGUE_SNAPSHOT_POINTER_FILE: /tmp/catalogue-current.json
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.44.0
      - name: Resolve and validate every upstream source
        run: |
          pnpm catalogue:update
          pnpm catalogue:descriptions
      - name: Build and publish the immutable snapshot
        run: |
          test -n "$SNAPSHOT_BUCKET"
          test -n "$SNAPSHOT_ENDPOINT"
          test -n "$S3_PUBLIC_BASE_URL"
          pnpm catalogue:snapshot pack
          id="$(jq -r .id "$CATALOGUE_SNAPSHOT_POINTER_FILE")"
          aws s3api head-object --bucket "$SNAPSHOT_BUCKET" --key "snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" >/dev/null 2>&1 \
            || aws s3 cp "$CATALOGUE_SNAPSHOT_FILE" "s3://$SNAPSHOT_BUCKET/snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" --only-show-errors
          curl --fail --location --silent --show-error "$S3_PUBLIC_BASE_URL/snapshots/$id.zip" --output /tmp/published-catalogue.zip
          CATALOGUE_SNAPSHOT_FILE=/tmp/published-catalogue.zip pnpm catalogue:snapshot verify
          aws s3 cp "$CATALOGUE_SNAPSHOT_POINTER_FILE" "s3://$SNAPSHOT_BUCKET/current.json" \
            --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/json --cache-control no-store --only-show-errors
