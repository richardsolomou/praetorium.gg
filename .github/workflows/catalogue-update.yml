name: Catalogue update

on:
  workflow_dispatch:
    inputs:
      repair-last-history:
        description: Recompute the last published update from its verified baseline
        required: false
        type: boolean
        default: false

concurrency:
  group: catalogue-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SNAPSHOT_BUCKET: praetorium
      SNAPSHOT_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CATALOGUE_SNAPSHOT_FILE: /tmp/catalogue-snapshot.zip
      CATALOGUE_SNAPSHOT_POINTER_FILE: /tmp/catalogue-current.json
      CATALOGUE_DISABLED_SOURCES: ${{ vars.CATALOGUE_DISABLED_SOURCES }}
      CATALOGUE_DIR: ${{ github.workspace }}/catalogue-sources/build/catalogue-data
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Check out pinned catalogue sources
        uses: actions/checkout@v7
        with:
          repository: richardsolomou/praetorium-catalogue
          ssh-key: ${{ secrets.CATALOGUE_SOURCES_DEPLOY_KEY }}
          path: catalogue-sources
      # Baselines report here rather than fail. They measure agreement between sources this
      # job does not control, so an upstream addition trips one and holds every unrelated
      # part of the refresh back until two upstreams agree about a name again. A shortfall
      # lands in the run summary and the `points` job still enforces the same numbers on a
      # pull request, where a pinned snapshot makes a moved number our regression. Nothing
      # here relaxes integrity: an unresolvable upstream or an incomplete snapshot still
      # fails, as does the archive verification below.
      - name: Resolve and validate every upstream source
        env:
          CATALOGUE_BASELINES: report
        run: |
          node catalogue-sources/scripts/materialize.mjs
          pnpm catalogue:supplemental
          pnpm catalogue:descriptions
          pnpm catalogue:points
      - name: Validate terrain geometry and marker labels
        if: ${{ !contains(format(',{0},', vars.CATALOGUE_DISABLED_SOURCES), ',battlemaster,') && !contains(format(',{0},', vars.CATALOGUE_DISABLED_SOURCES), ',datacards,') }}
        run: pnpm catalogue:terrain
      # The history the published snapshot carries, plus whatever changed since it, travels
      # in the new one so every instance can say what an update changed. A requested repair
      # fails closed if either published snapshot cannot be verified.
      - name: Carry the data-update history forward
        env:
          CATALOGUE_BASE_URL: https://s3.praetorium.gg/catalogue
        run: pnpm catalogue:history ${{ inputs['repair-last-history'] && '--repair-last' || '' }}
      - name: Build and publish the immutable snapshot
        run: |
          test -n "$SNAPSHOT_BUCKET"
          test -n "$SNAPSHOT_ENDPOINT"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          pnpm catalogue:snapshot pack
          id="$(jq -r .id "$CATALOGUE_SNAPSHOT_POINTER_FILE")"
          aws s3api head-object --bucket "$SNAPSHOT_BUCKET" --key "catalogue/snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" >/dev/null 2>&1 \
            || aws s3 cp "$CATALOGUE_SNAPSHOT_FILE" "s3://$SNAPSHOT_BUCKET/catalogue/snapshots/$id.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/zip --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          aws s3 cp "s3://$SNAPSHOT_BUCKET/catalogue/snapshots/$id.zip" /tmp/published-catalogue.zip \
            --endpoint-url "$SNAPSHOT_ENDPOINT" --only-show-errors
          CATALOGUE_SNAPSHOT_FILE=/tmp/published-catalogue.zip pnpm catalogue:snapshot verify
          CATALOGUE_SNAPSHOT_FILE=/tmp/published-catalogue.zip pnpm catalogue:snapshot install
          aws s3 cp catalogue/revocations.json "s3://$SNAPSHOT_BUCKET/catalogue/revocations.json" \
            --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/json --cache-control no-store --only-show-errors
          aws s3 cp "$CATALOGUE_SNAPSHOT_POINTER_FILE" "s3://$SNAPSHOT_BUCKET/catalogue/current.json" \
            --endpoint-url "$SNAPSHOT_ENDPOINT" --content-type application/json --cache-control no-store --only-show-errors
          jq -r '.snapshots[]' catalogue/revocations.json | while read -r revoked; do
            aws s3 rm "s3://$SNAPSHOT_BUCKET/catalogue/snapshots/$revoked.zip" --endpoint-url "$SNAPSHOT_ENDPOINT" --only-show-errors
          done

  combat-rules:
    needs: update
    uses: ./.github/workflows/combat-rule-audit.yml
    secrets: inherit
