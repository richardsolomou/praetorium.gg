name: Legacy preview cleanup

on:
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    if: startsWith(github.event.pull_request.head.ref, 'release-candidate/') == false
    permissions:
      contents: read
      packages: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v1
    with:
      package: praetorium.gg
      local-image: praetorium.gg
      application-prefix: praetorium
      domain: praetorium.gg
      port: 3000
      deploy-script: scripts/previewDeploy.ts
      marker: <!-- praetorium-legacy-preview -->
    secrets: inherit
