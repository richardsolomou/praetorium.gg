name: PR preview deploy

# Runs on `workflow_run`, so a fork's pull request never gets a token or a secret:
# its build produces an artifact, and this workflow — which is the repository's own
# code — is what publishes and deploys it.
on:
  workflow_run:
    workflows: [PR preview build]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_IMAGE: ghcr.io/${{ github.repository_owner }}/praetorium.gg-preview:pr-${{ github.event.workflow_run.pull_requests[0].number }}

jobs:
  mark-fork-awaiting-approval:
    if: github.event_name == 'workflow_run' && github.event.action == 'requested' && github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
    permissions:
      contents: read
      checks: write
      issues: write
    uses: richardsolomou/ras-stack/.github/workflows/report-preview-status.yml@v0.35.0
    with:
      state: awaiting
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      sha: ${{ github.event.workflow_run.head_sha }}
      preview-url: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.praetorium.gg
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      marker: <!-- praetorium-preview -->
      note: Sign in with `preview@praetorium.gg` / `preview-preview-preview`. Preview data is disposable and resets on every deployment.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  mark-fork-deploying:
    if: github.event_name == 'workflow_run' && github.event.action == 'in_progress' && github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
    permissions:
      contents: read
      checks: write
      issues: write
    uses: richardsolomou/ras-stack/.github/workflows/report-preview-status.yml@v0.35.0
    with:
      state: building
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      sha: ${{ github.event.workflow_run.head_sha }}
      preview-url: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.praetorium.gg
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      marker: <!-- praetorium-preview -->
      note: Sign in with `preview@praetorium.gg` / `preview-preview-preview`. Preview data is disposable and resets on every deployment.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.35.0
      - name: Download preview image
        if: github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
        uses: actions/download-artifact@v8
        with:
          name: preview-image-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/preview-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish preview image
        if: github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
        env:
          SOURCE_IMAGE: praetorium.gg-preview:${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          docker load --input "$RUNNER_TEMP/preview-image/preview-image.tar"
          docker tag "$SOURCE_IMAGE" "$PREVIEW_IMAGE"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$PREVIEW_IMAGE"
      - name: Deploy preview
        id: deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_REGISTRY_USERNAME: ${{ secrets.PREVIEW_REGISTRY_USERNAME }}
          PREVIEW_REGISTRY_PASSWORD: ${{ secrets.PREVIEW_REGISTRY_PASSWORD }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: pnpm exec tsx scripts/previewDeploy.ts deploy
      - name: Mark preview as ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_MARKER: <!-- praetorium-preview -->
          PREVIEW_NOTE: Sign in with `preview@praetorium.gg` / `preview-preview-preview`. Preview data is disposable and resets on every deployment.
          PREVIEW_URL: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.praetorium.gg
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec ras preview ready
      - name: Mark preview as failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_MARKER: <!-- praetorium-preview -->
          PREVIEW_NOTE: Sign in with `preview@praetorium.gg` / `preview-preview-preview`. Preview data is disposable and resets on every deployment.
          PREVIEW_URL: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.praetorium.gg
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec ras preview failed

  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.35.0
      - name: Delete preview
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec tsx scripts/previewDeploy.ts delete
      - name: Mark preview as deleted
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_MARKER: <!-- praetorium-preview -->
        run: pnpm exec ras preview deleted
