name: PR preview deploy

on:
  workflow_run:
    workflows: [CI, Preview image]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.name == 'Preview image' }}

jobs:
  report-ci-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI' && github.event.action == 'completed' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'action_required' && github.event.workflow_run.pull_requests[0] && github.event.workflow_run.head_sha == github.event.workflow_run.pull_requests[0].head.sha
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/report-preview-status.yml@v0.47.0
    with:
      state: failed
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      sha: ${{ github.event.workflow_run.head_sha }}
      preview-url: https://pr-${{ github.event.workflow_run.pull_requests[0].number }}.praetorium.gg
      run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
      marker: <!-- praetorium-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  preview:
    if: github.event_name == 'pull_request_target' || (github.event.workflow_run.name == 'Preview image' && github.event.workflow_run.event == 'pull_request')
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v0.47.5
    with:
      package: praetorium.gg
      local-image: praetorium.gg
      application-prefix: praetorium
      domain: praetorium.gg
      port: 3000
      # The environment is composed by the script, not here: it carries the preview
      # Postgres URL, which must not live in a public file.
      deploy-script: scripts/previewDeploy.ts
      marker: <!-- praetorium-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
    secrets: inherit
