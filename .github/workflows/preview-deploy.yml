name: PR preview deploy

on:
  workflow_run:
    workflows: [PR preview build]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v0.36.0
    with:
      package: praetorium.gg
      local-image: praetorium.gg
      application-prefix: praetorium
      domain: praetorium.gg
      port: 3000
      environment: |
        APP_URL=https://pr-{{PR_NUMBER}}.praetorium.gg
        PRAETORIUM_SEED_PREVIEW=true
      marker: <!-- praetorium-preview -->
      note: Sign in with `preview@praetorium.gg` / `preview-preview-preview`. Preview data is disposable and resets on every deployment.
    secrets: inherit
