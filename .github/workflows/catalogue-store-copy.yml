name: Catalogue store copy

# Copies every published catalogue artifact from the public bucket into the private one, so
# readers can move to the private store without losing a snapshot. Safe to repeat: objects
# are immutable and already present ones are skipped.
on:
  pull_request:
    paths:
      - .github/workflows/catalogue-store-copy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Copy the published artifacts
        run: |
          set -euo pipefail
          # The compiled runtime holds no source files and stays where builds read it.
          aws s3 sync s3://praetorium/catalogue/ s3://praetorium-private/catalogue/ --exclude 'runtime/*' --endpoint-url "$ENDPOINT" --only-show-errors
      - name: Compare what each bucket holds
        run: |
          set -euo pipefail
          list() { aws s3api list-objects-v2 --bucket "$1" --prefix catalogue/ --endpoint-url "$ENDPOINT" --query 'Contents[].[Key,Size]' --output text | grep -v '^catalogue/runtime/' | sort; }
          diff <(list praetorium) <(list praetorium-private)
          echo "Copied $(list praetorium-private | wc -l) catalogue artifacts"
