name: CI e2e

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
      runner-count:
        type: string
        required: true
      runners:
        type: string
        required: true

permissions:
  contents: read

jobs:
  e2e-shard:
    name: E2E runner ${{ matrix.runner }} of ${{ inputs.runner-count }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The browser-test build saved the dependency cache this restores, so the pnpm store `setup-js` restores goes unused.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - uses: ./.github/actions/e2e-dependencies
      # Catalogue snapshots are private, read only by this sync.
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.SNAPSHOT_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SNAPSHOT_R2_SECRET_ACCESS_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: browser-test-build
          path: data-dev/e2e-build
      - uses: actions/download-artifact@v8
        with:
          name: e2e-shards
          path: ${{ runner.temp }}/e2e-shards
      - uses: ./.github/actions/verify-browser-build
      - uses: ./.github/actions/setup-spacetime
        id: spacetime
      - name: Run the E2E shard
        env:
          E2E_SHARD: ${{ matrix.runner }}
          SPACETIME_BIN: ${{ steps.spacetime.outputs.cli-path }}
          PLAYWRIGHT_STARTUP_REPORT: e2e-startup-${{ matrix.runner }}.json
        run: |
          PLAYWRIGHT_PORT="$((4170 + E2E_SHARD))" \
            PLAYWRIGHT_OUTPUT_DIR="test-results-$E2E_SHARD" \
            PLAYWRIGHT_JSON_OUTPUT_NAME="e2e-report-$E2E_SHARD.json" \
            pnpm exec playwright test --test-list="$RUNNER_TEMP/e2e-shards/$E2E_SHARD.txt" --reporter=github,json
      - name: Report browser-test startup
        if: success() || failure()
        run: |
          if test -f "e2e-startup-${{ matrix.runner }}.json"; then
            echo 'Browser-test startup (seconds):' >> "$GITHUB_STEP_SUMMARY"
            cat "e2e-startup-${{ matrix.runner }}.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      # `just e2e-durations <run id>` rebalances the runners from these reports.
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.runner }}
          path: e2e-report-${{ matrix.runner }}.json
          retention-days: 30
          if-no-files-found: ignore
      # A test that passes on retry still leaves its failed attempt's trace here; screenshots
      # that passing tests write are not worth an upload.
      - if: failure() || (success() && hashFiles(format('test-results-{0}/**/trace.zip', matrix.runner)) != '')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.runner }}
          path: |
            test-results
            test-results-*
          retention-days: 7
