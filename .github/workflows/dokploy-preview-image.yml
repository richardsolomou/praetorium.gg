name: Dokploy preview image

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref, 'release-candidate/') == false
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@v1
    with:
      package: praetorium.gg
      local-image: praetorium-preview
      domain: praetorium.gg
      subdomain-prefix: pr
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      dockerfile: Dockerfile.node
      build-args: |
        GITHUB_SHA=${{ github.event.pull_request.head.sha }}
        VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
        VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      cache-scope: praetorium-preview
