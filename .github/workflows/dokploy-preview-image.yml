name: Dokploy preview image

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@627f0857a9bf8623cda27193d461a34b6e40d1f9
    with:
      package: praetorium.gg
      local-image: praetorium-preview
      domain: praetorium.gg
      subdomain-prefix: pr
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      dockerfile: Dockerfile.node
      platform: linux/arm64
      build-args: |
        GITHUB_SHA=${{ github.event.pull_request.head.sha }}
      cache-scope: praetorium-preview
