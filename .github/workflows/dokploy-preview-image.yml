name: Dokploy preview image

# A maintainer asks for a preview by adding the `preview` label, since only they can label a pull request; pushes build none.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  # Taking the label off at once lets adding it again deploy the newest commit. A fork's token can't, so a maintainer removes it there.
  take-label:
    if: github.event.label.name == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label preview

  build:
    if: github.event.label.name == 'preview'
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@e4485fd0eddf67b197a5c2095012a956c784ff6e
    with:
      package: praetorium.gg
      local-image: praetorium-preview
      domain: praetorium.gg
      subdomain-prefix: pr
      marker: <!-- praetorium-vm-preview -->
      note: Test battles with `preview@praetorium.gg` / `preview-preview-preview` and `opponent@praetorium.gg` / `opponent-opponent-opponent`. Preview data is disposable and resets on every deployment.
      dockerfile: Dockerfile.node
      # Matches the hosted VM.
      platform: linux/arm64
      build-args: |
        GITHUB_SHA=${{ github.event.pull_request.head.sha }}
      cache-scope: praetorium-preview
