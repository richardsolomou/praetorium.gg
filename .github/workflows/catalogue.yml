name: Catalogue snapshot

# Builds catalogue/ into a verified snapshot, publishes it as an inactive candidate, and pins it on the branch.
# Production deploys activate the pinned snapshot; nothing here changes what live servers or current.json use.
on:
  pull_request:
    paths: [catalogue/**]
  workflow_dispatch:
    inputs:
      force:
        description: Republish even though catalogue/ is unchanged since the pinned snapshot
        type: boolean
        default: false

concurrency:
  group: catalogue-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    # Pointer commits need a branch this repository can push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      CATALOGUE_DIR: ${{ github.workspace }}/build/catalogue-data
      CATALOGUE_SNAPSHOT_FILE: ${{ github.workspace }}/build/release/snapshot.zip
      CATALOGUE_SNAPSHOT_POINTER_FILE: ${{ github.workspace }}/build/release/release.json
      CATALOGUE_OBJECTS_DIR: ${{ github.workspace }}/build/objects
      # Catalogue snapshots are private: the scripts read them with these.
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
    steps:
      # A personal token, so the pointer commit runs the required checks.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.CHANGESETS_TOKEN }}
      - name: Compare catalogue/ with the pinned snapshot
        id: pinned
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:catalogue)"
          if [[ "$FORCE" != true && "$(jq -r .pointer.authoringRevision catalogue.json)" == "$tree" ]]; then
            echo "The pinned snapshot already contains catalogue/ $tree"
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
          echo "battlemaster=$(jq -r .battlemaster.revision catalogue/sources.json)" >> "$GITHUB_OUTPUT"
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
        if: steps.pinned.outputs.current != 'true'
      - uses: actions/cache@v6
        if: steps.pinned.outputs.current != 'true'
        with:
          path: build/battlemaster-cache
          key: battlemaster-${{ steps.pinned.outputs.battlemaster }}
      - name: Materialize the sources
        if: steps.pinned.outputs.current != 'true'
        run: CATALOGUE_BATTLEMASTER_CACHE=build/battlemaster-cache pnpm catalogue:materialize
      - name: Validate the assembled catalogue
        if: steps.pinned.outputs.current != 'true'
        env:
          CATALOGUE_BASELINES: report
        run: |
          pnpm catalogue:descriptions
          pnpm catalogue:points
          pnpm catalogue:terrain
          pnpm exec vitest run scripts/custodesAttachments.integration.test.ts
      - name: Carry history forward and prepare release artifacts
        if: steps.pinned.outputs.current != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/release build/offline/assets
          pnpm catalogue:history
          pnpm catalogue:snapshot pack
          node --expose-gc --import tsx scripts/benchmarkCatalogueMemory.ts source "$CATALOGUE_DIR" --verify > build/source-projections.jsonl &
          source_projections=$!
          pnpm catalogue:snapshot verify
          CATALOGUE_RUNTIME_STORE=off CATALOGUE_CACHE_DIR=off LOCAL_BUILD_DIR=build/release pnpm exec tsx scripts/compileCatalogueRuntime.ts
          pnpm exec tsx -e "import('./scripts/lib/offlineReferenceBundle.ts').then(({ writeReferenceBundle }) => writeReferenceBundle('build/offline'))" &
          offline_bundle=$!
          node --expose-gc --import tsx scripts/benchmarkCatalogueMemory.ts runtime "$CATALOGUE_DIR" build/release/server/catalogue-runtime --verify > build/runtime-projections.jsonl &
          runtime_projections=$!
          cp build/objects/manifest.json build/release/manifest.json
          cp catalogue/revocations.json build/release/revocations.json
          wait "$source_projections"
          wait "$offline_bundle"
          wait "$runtime_projections"
          pnpm exec tsx scripts/verifyCatalogueProjections.ts build/source-projections.jsonl build/runtime-projections.jsonl
      - uses: actions/upload-artifact@v7
        if: steps.pinned.outputs.current != 'true'
        with:
          name: catalogue-release
          path: build/release/*.json
          retention-days: 14
      - uses: actions/setup-python@v7
        if: steps.pinned.outputs.current != 'true'
        with:
          python-version: '3.13'
      - name: Publish the candidate to the private store
        if: steps.pinned.outputs.current != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -m pip install --quiet boto3==1.43.113
          python3 scripts/publishCatalogue.py publish
      - name: Pin the candidate on the branch
        if: steps.pinned.outputs.current != 'true'
        run: |
          set -euo pipefail
          id="$(jq -r .id build/release/release.json)"
          pnpm catalogue:snapshot lock "$id"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogue.json
          git commit --message "chore(catalogue): pin snapshot ${id:0:12}"
          git push origin "HEAD:$BRANCH"
