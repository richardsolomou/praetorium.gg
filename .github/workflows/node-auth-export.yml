name: Export auth for Node migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: D1 auth database to export
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: node-auth-export-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Export and verify D1 auth snapshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.CLOUDFLARE_PRODUCTION_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
          AUTH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          config="wrangler.$AUTH_ENVIRONMENT.json"
          pnpm exec wrangler d1 export AUTH_DB --config "$config" --remote \
            --skip-confirmation --output "$RUNNER_TEMP/auth.sql"
          node scripts/nodeAuthSqlite.ts upload-r2 "$RUNNER_TEMP/auth.sql" "$AUTH_ENVIRONMENT" \
            > "$RUNNER_TEMP/auth-export.json"
          jq '{key, counts}' "$RUNNER_TEMP/auth-export.json"
