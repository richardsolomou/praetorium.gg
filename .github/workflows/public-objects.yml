name: Copy private R2 objects

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Inventory every key before public exposure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          aws s3api list-objects-v2 --bucket praetorium --endpoint-url "$ENDPOINT" --query 'Contents[].Key' --output json > "$RUNNER_TEMP/source-keys.json"
          python3 - <<'PY'
          import json, pathlib, re, os
          keys = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-keys.json').read_text())
          public = re.compile(r'(?:avatars/[0-9a-f]{64}\.(?:jpg|png|webp)|catalogue/.*)')
          private = re.compile(r'(?:backups/.*|praetoriumgg-spacetimedb-prod-fc6ghi/.*)')
          unexpected = [key for key in keys if not public.fullmatch(key) and not private.fullmatch(key)]
          if unexpected:
              raise SystemExit(f'{len(unexpected)} keys do not belong in either bucket: {unexpected[:5]}')
          print(f'Classified {sum(bool(public.fullmatch(key)) for key in keys)} public and {sum(bool(private.fullmatch(key)) for key in keys)} private objects')
          PY
      - name: Download private objects from the current bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/private-source"
          mkdir -p "$SOURCE/backups" "$SOURCE/praetoriumgg-spacetimedb-prod-fc6ghi"
          aws s3 sync s3://praetorium/backups/ "$SOURCE/backups/" --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync s3://praetorium/praetoriumgg-spacetimedb-prod-fc6ghi/ "$SOURCE/praetoriumgg-spacetimedb-prod-fc6ghi/" --endpoint-url "$ENDPOINT" --only-show-errors
      - name: Upload and verify every private object in the new bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/private-source"
          VERIFY="$RUNNER_TEMP/private-verified"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          aws s3 sync "$SOURCE/" s3://praetorium-private/ --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 sync s3://praetorium-private/ "$VERIFY/" --endpoint-url "$ENDPOINT" --only-show-errors
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ['RUNNER_TEMP']) / 'private-source'
          verified = Path(os.environ['RUNNER_TEMP']) / 'private-verified'
          for original in source.rglob('*'):
              if not original.is_file():
                  continue
              copy = verified / original.relative_to(source)
              if not copy.is_file():
                  raise SystemExit(f'Missing private object: {original.relative_to(source)}')
              with original.open('rb') as source_file, copy.open('rb') as copy_file:
                  if hashlib.file_digest(source_file, 'sha256').digest() != hashlib.file_digest(copy_file, 'sha256').digest():
                      raise SystemExit(f'Private object failed verification: {original.relative_to(source)}')
          print('Every copied private object matches its source')
          PY
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Restore the latest auth archive from the private bucket
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          key="$(aws s3api list-objects-v2 --bucket praetorium-private --prefix backups/auth/production/ --endpoint-url "$ENDPOINT" --query 'sort_by(Contents,&Key)[-1].Key' --output text)"
          [[ "$key" =~ ^backups/auth/production/[0-9]{8}T[0-9]{6}Z-[0-9a-f]{16}\.zip$ ]]
          node --import tsx scripts/nodeAuthBackup.ts restore "$key" "$RUNNER_TEMP/auth-restore" > /dev/null
          echo 'Auth archive restored and SQLite verified'
