name: Dokploy web deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: Web environment to deploy
        required: true
        type: choice
        options: [staging, production]
      revision:
        description: Full main-branch commit SHA to redeploy (for rollback)
        required: false
        type: string
      skip-product-publish:
        description: Reuse the installed product module during a web-only rollback
        required: false
        type: boolean
        default: false

concurrency:
  group: dokploy-web-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A replica serves only once its catalogue is prepared for its compiler; preparing it here, beside the image build, lets it download that instead of compiling it.
  # A replica on a new compiler starts from the pinned snapshot and then refreshes to the live catalogue, so both are prepared, side by side.
  catalogue:
    name: Prepare the ${{ matrix.catalogue }} catalogue
    if: inputs.environment == 'production'
    strategy:
      fail-fast: false
      matrix:
        catalogue: [live, pinned]
    # The replica compiles its own catalogue without it, so a failure here never fails the deploy.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - run: pnpm exec tsx scripts/prepareLiveCatalogue.ts "$SOURCE"
        env:
          SOURCE: ${{ matrix.catalogue == 'pinned' && '--pinned' || inputs.environment }}

  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      TARGET: ${{ inputs.environment }}
      DEPLOY_SHA: ${{ inputs.revision || github.sha }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ inputs.environment == 'production' && vars.DOKPLOY_PRODUCTION_WEB_APP_ID || vars.DOKPLOY_STAGING_WEB_APP_ID }}
      DOKPLOY_ENVIRONMENT_ID: ${{ inputs.environment == 'production' && vars.DOKPLOY_PRODUCTION_ENVIRONMENT_ID || secrets.DOKPLOY_ENVIRONMENT_ID }}
      AUTH_SECRET: ${{ inputs.environment == 'production' && secrets.PRODUCTION_AUTH_SECRET || secrets.STAGING_AUTH_SECRET }}
      SPACETIME_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_SPACETIME_URL || vars.SPACETIME_URL }}
      SPACETIME_INTERNAL_HOST: ${{ inputs.environment == 'production' && vars.PRODUCTION_SPACETIME_INTERNAL_HOST || vars.STAGING_SPACETIME_INTERNAL_HOST }}
      SPACETIME_OPERATOR_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN || secrets.STAGING_SPACETIME_OPERATOR_TOKEN }}
      SPACETIME_ACCESS_CLIENT_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID || secrets.SPACETIME_ACCESS_CLIENT_ID }}
      SPACETIME_ACCESS_CLIENT_SECRET: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET || secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
      SPACETIME_OWNER_TOKEN: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SPACETIME_OWNER_TOKEN || secrets.SPACETIME_ADMIN_TOKEN }}
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ secrets.PRAETORIUM_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.PRAETORIUM_GITHUB_CLIENT_SECRET }}
      GITHUB_SPONSORS_TOKEN: ${{ secrets.PRAETORIUM_GITHUB_SPONSORS_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_SUPPORT_IDENTITY_SECRET: ${{ secrets.POSTHOG_SUPPORT_IDENTITY_SECRET }}
      POSTHOG_SUPPORT_API_KEY: ${{ secrets.POSTHOG_SUPPORT_API_KEY }}
      SUPPORT_REPLY_WEBHOOK_SECRET: ${{ secrets.SUPPORT_REPLY_WEBHOOK_SECRET }}
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Require an immutable main revision for production
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$TARGET" == production ]]; then
            if [[ "$GITHUB_REF_NAME" != main && -z "${{ inputs.revision }}" ]]; then
              echo 'Production web deploys must use main or an explicit rollback revision' >&2
              exit 1
            fi
            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          fi
          test -n "$DOKPLOY_APPLICATION_ID"
          test -n "$DOKPLOY_ENVIRONMENT_ID"
          test -n "$SPACETIME_OWNER_TOKEN"
      # A re-run release must not roll back a newer deploy; a rollback is an explicit workflow_dispatch.
      - name: Refuse to replace a newer deployed revision
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          installed="$(node scripts/configureDokployNode.ts image "$TARGET")"
          live="$(sed -n 's/.*:sha-\([0-9a-f]\{40\}\)@sha256:.*/\1/p' <<< "$installed")"
          : "${live:?the installed image $installed names no revision}"
          if ! git merge-base --is-ancestor "$live" "$DEPLOY_SHA"; then
            echo "::error::$TARGET already runs $live, which $DEPLOY_SHA does not contain. Roll back through workflow_dispatch instead." >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build and publish Node image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v1
        with:
          platforms: linux/amd64,linux/arm64
          image: ghcr.io/${{ github.repository }}
          sha: ${{ inputs.revision || github.sha }}
          release-tag: ${{ inputs.environment }}
          token: ${{ github.token }}
          dockerfile: Dockerfile.node
          build-args: |
            GITHUB_SHA=${{ inputs.revision || github.sha }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
            POSTHOG_UPLOAD_SOURCEMAPS=true
            POSTHOG_CLI_HOST=${{ vars.POSTHOG_HOST }}
            POSTHOG_CLI_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
          secrets: |
            posthog_api_key=${{ secrets.POSTHOG_API_KEY }}
          cache-scope: node-web-image
          # Nothing verifies image attestations, and generating them costs about 20 seconds per release.
          sbom: 'false'
          provenance: 'false'
      - name: Publish and route shared build assets before changing replicas
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          installed="$(node scripts/configureDokployNode.ts image "$TARGET")"
          docker pull "$installed"
          docker pull "$IMAGE"
          previous="$(docker create "$installed")"
          current="$(docker create "$IMAGE")"
          trap 'docker rm "$previous" "$current" > /dev/null' EXIT
          mkdir "$RUNNER_TEMP/previous-assets" "$RUNNER_TEMP/current-assets"
          docker cp "$previous:/app/.output/public/assets/." "$RUNNER_TEMP/previous-assets/"
          docker cp "$current:/app/.output/public/assets/." "$RUNNER_TEMP/current-assets/"
          node scripts/publishWebAssets.ts "$RUNNER_TEMP/previous-assets" "$RUNNER_TEMP/current-assets"
          node scripts/configureDokployNode.ts assets "$TARGET" "$RUNNER_TEMP/previous-assets" "$RUNNER_TEMP/current-assets"
      - name: Publish the matching product module
        if: inputs['skip-product-publish'] != true
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          container="$(docker create "$IMAGE")"
          trap 'docker rm "$container" > /dev/null' EXIT
          docker cp "$container:/app/spacetimedb/dist/bundle.js" "$RUNNER_TEMP/product.js"
          node --import tsx scripts/publishProductModule.ts "$RUNNER_TEMP/product.js" "$TARGET"
      - name: Migrate saved product data before updating web replicas
        if: ${{ !inputs.skip-product-publish }}
        run: node --import tsx scripts/migrateProductData.ts "$TARGET"
      - name: Configure the selected web service
        run: node scripts/configureDokployNode.ts configure "$TARGET"
      # Compared with the sitemap after the deploy, so only pages it added or re-dated reach IndexNow; the query string skips the edge's cached copy.
      - name: Record the sitemap production serves before the deploy
        if: inputs.environment == 'production'
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 30 --output "$RUNNER_TEMP/sitemap-before.xml" "https://praetorium.gg/sitemap.xml?before=${DEPLOY_SHA}"
      # A failed or slow preparation leaves the replica to compile its own catalogue, as it would without one.
      - name: Wait for the prepared catalogues
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 120); do
            pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | test("Prepare the (live|pinned) catalogue$")) | select(.status != "completed")] | length')"
            if [[ "$pending" == 0 ]]; then exit 0; fi
            sleep 10
          done
          echo '::warning::A catalogue is still being prepared; the replica prepares its own'
      - name: Deploy the pinned image
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ env.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
          registry-url: ghcr.io
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GHCR_PULL_TOKEN }}
      - name: Verify the deployed revision after catalogue preparation
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/lib/webReadiness.ts" > "$RUNNER_TEMP/web-readiness.mts"
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url'
          const { waitForWebRevision } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/web-readiness.mts`).href)
          await waitForWebRevision(process.env.TARGET === 'production' ? 'https://praetorium.gg' : 'https://staging.praetorium.gg', process.env.DEPLOY_SHA)
          NODE
      # Catalogue discovery and the history baseline follow production, so a rollback also returns current.json to the snapshot it serves.
      - name: Activate the catalogue snapshot production serves
        if: inputs.environment == 'production'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/publishCatalogue.py activate "$(jq -r .pointer.id catalogue.json)"
      - name: Verify and schedule production auth backups
        if: inputs.environment == 'production'
        run: node scripts/dokployAuthSchedule.ts
      # Search engines recrawl on their own schedule regardless, so a failure here never fails the release.
      - name: Tell search engines which pages changed
        if: inputs.environment == 'production'
        continue-on-error: true
        run: node scripts/submitIndexNow.ts "$RUNNER_TEMP/sitemap-before.xml" https://praetorium.gg "$RUNNER_TEMP/sitemap-after.xml"
      - name: Retain sitemap comparison evidence
        if: always() && inputs.environment == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: production-sitemaps
          path: ${{ runner.temp }}/sitemap-*.xml
          retention-days: 7
          if-no-files-found: ignore
