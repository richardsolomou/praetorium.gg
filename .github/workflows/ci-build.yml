name: CI build

on:
  workflow_call:
    inputs:
      runtime:
        description: Whether the change needs the runtime checks
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    if: inputs.runtime
    runs-on: ubuntu-latest
    # A catalogue runtime or offline reference that no build has shared yet is uploaded under its key for every later build and deployment.
    env:
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ASSETS_R2_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      ASSETS_R2_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The startup bundle check builds the merge commit's first parent too.
          fetch-depth: 2
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_CATALOGUE_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CATALOGUE_READ_SECRET_ACCESS_KEY }}
      - run: pnpm build
      - run: pnpm typecheck
      # Nothing else fails when a route file or the shell pulls page code into what every page preloads.
      # The base skips the offline reference, which changes no client chunk.
      - name: Compare the startup bundle with the base
        if: github.event_name == 'pull_request'
        env:
          CATALOGUE_RUNTIME_FETCH: 'true'
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/startup-base"
          # As in `ci-scope.yml`, the merge commit's first parent is the base it merged into.
          git worktree add --detach "$base" "$(git rev-parse HEAD^1)"
          (cd "$base" && pnpm install --frozen-lockfile && pnpm exec vite build)
          node scripts/startupBundle.ts .output "$base/.output"
