name: Combat rule audit

on:
  # It reads the published catalogue rather than the pushed code, so a daily run keeps the shortlist current.
  schedule:
    - cron: '33 14 * * *'
  workflow_dispatch:

concurrency:
  group: combat-rule-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: praetorium-private
      S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Read the published catalogue
        uses: ./.github/actions/catalogue-sync
        with:
          args: --latest
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      - name: Inventory all rule descriptions
        run: |
          mkdir -p combat-reports
          pnpm -s catalogue:combat --json > combat-reports/inventory.json
      - name: Restore Jev judgments
        id: judgments
        run: |
          test -n "$S3_BUCKET"
          test -n "$S3_ENDPOINT"
          mkdir -p .combat-rule-cache
          # One small object per judgment, so the CLI's default ten transfers spend minutes on round trips.
          aws configure set default.s3.max_concurrent_requests 64
          aws s3 sync "s3://$S3_BUCKET/audits/combat-rule-judgments/v1/" .combat-rule-cache \
            --endpoint-url "$S3_ENDPOINT" --exclude '*' --include '*.json' --only-show-errors
      - name: Validate damage relevance questions
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm catalogue:combat:eval
      - name: Shortlist attacker and defender support gaps
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm catalogue:combat:shortlist --input combat-reports/inventory.json --concurrency 32
      - name: Preserve completed judgments for the next run
        if: always() && steps.judgments.outcome == 'success'
        run: |
          aws s3 sync .combat-rule-cache "s3://$S3_BUCKET/audits/combat-rule-judgments/v1/" \
            --endpoint-url "$S3_ENDPOINT" --exclude '*' --include '*.json' --no-follow-symlinks --only-show-errors
      - name: Store the inventory and shortlist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-rule-shortlist
          path: combat-reports
          retention-days: 14
          if-no-files-found: error
