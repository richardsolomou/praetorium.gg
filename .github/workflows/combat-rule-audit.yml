name: Combat rule audit

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      migrate_cache:
        description: Copy the existing judgment cache to private R2
        type: boolean
        default: false

concurrency:
  group: combat-rule-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: inputs.migrate_cache == true
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Download the existing judgment cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync s3://praetorium/catalogue/combat-rule-judgments/v1/ "$RUNNER_TEMP/audit-cache" --endpoint-url "$S3_ENDPOINT" --only-show-errors
          test "$(find "$RUNNER_TEMP/audit-cache" -type f | wc -l)" -gt 0
      - name: Copy and verify the private cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync "$RUNNER_TEMP/audit-cache" s3://praetorium-private/audits/combat-rule-judgments/v1/ --endpoint-url "$S3_ENDPOINT" --only-show-errors
          aws s3 sync s3://praetorium-private/audits/combat-rule-judgments/v1/ "$RUNNER_TEMP/readback" --endpoint-url "$S3_ENDPOINT" --only-show-errors
          diff -qr "$RUNNER_TEMP/audit-cache" "$RUNNER_TEMP/readback"
          echo "Verified $(find "$RUNNER_TEMP/readback" -type f | wc -l) judgment objects"
  audit:
    if: inputs.migrate_cache != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: praetorium-private
      S3_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Read the published catalogue
        run: pnpm catalogue:sync --latest
      - name: Inventory all rule descriptions
        run: |
          mkdir -p combat-reports
          pnpm exec tsx scripts/auditCombatRules.ts --json > combat-reports/inventory.json
      - name: Restore Jev judgments
        id: judgments
        run: |
          test -n "$S3_BUCKET"
          test -n "$S3_ENDPOINT"
          mkdir -p .combat-rule-cache
          aws s3 sync "s3://$S3_BUCKET/audits/combat-rule-judgments/v1/" .combat-rule-cache \
            --endpoint-url "$S3_ENDPOINT" --exclude '*' --include '*.json' --only-show-errors
      - name: Validate damage relevance questions
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm catalogue:combat:eval
      - name: Shortlist attacker and defender support gaps
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm catalogue:combat:shortlist --input combat-reports/inventory.json --concurrency 32
      - name: Preserve completed judgments for the next run
        if: always() && steps.judgments.outcome == 'success'
        run: |
          aws s3 sync .combat-rule-cache "s3://$S3_BUCKET/audits/combat-rule-judgments/v1/" \
            --endpoint-url "$S3_ENDPOINT" --exclude '*' --include '*.json' --no-follow-symlinks --only-show-errors
      - name: Store the inventory and shortlist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-rule-shortlist
          path: combat-reports
          retention-days: 14
          if-no-files-found: error
