name: CI integration

on:
  workflow_call:
    inputs:
      runtime:
        description: Whether the change needs the runtime checks
        type: boolean
        required: true

permissions:
  contents: read

# A pull request runs only the suites its changes reach through imports; vitest.integration.config.ts lists what reruns them all.
env:
  CHANGED: ${{ github.event_name == 'pull_request' && '--changed HEAD^1 --passWithNoTests' || '' }}

jobs:
  integration:
    if: inputs.runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` compares the merge commit with its first parent.
          fetch-depth: 2
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_CATALOGUE_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CATALOGUE_READ_SECRET_ACCESS_KEY }}
      - uses: ./.github/actions/setup-spacetime
        id: spacetime
      - run: pnpm test:integration --project '!client-text' ${{ env.CHANGED }}
        env:
          SPACETIME_BIN: ${{ steps.spacetime.outputs.cli-path }}
      - run: pnpm test:spacetime
        env:
          SPACETIME_BIN: ${{ steps.spacetime.outputs.cli-path }}
      - run: pnpm test:python

  # Builds every published payload single-threaded, so it runs beside the other integration tests rather than after them.
  client-text:
    if: inputs.runtime
    runs-on: ubuntu-latest
    # An offline reference no run has shared yet goes to the CI bucket under its key, for later runs and previews.
    env:
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CI_OUTPUTS_R2_ACCESS_KEY_ID: ${{ secrets.R2_CI_OUTPUTS_ACCESS_KEY_ID }}
      CI_OUTPUTS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_OUTPUTS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` compares the merge commit with its first parent.
          fetch-depth: 2
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_CATALOGUE_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_CATALOGUE_READ_SECRET_ACCESS_KEY }}
      - run: pnpm test:integration --project client-text ${{ env.CHANGED }}
