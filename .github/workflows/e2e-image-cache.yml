name: E2E image cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-image-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Warm the E2E image cache
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=max,scope=e2e-image

  warm-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.44.0
        with:
          install: 'false'
      - name: Restore E2E dependencies
        id: e2e-dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - name: Install E2E dependencies
        if: steps.e2e-dependencies.outputs.cache-hit != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --only-shell
