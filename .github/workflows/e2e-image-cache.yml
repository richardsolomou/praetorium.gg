name: E2E image cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-image-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Warm the E2E image cache
        uses: docker/build-push-action@v7
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=max,scope=e2e-image
