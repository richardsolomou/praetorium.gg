name: Cloudflare preview image

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref, 'release-candidate/') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Build SpacetimeDB module
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build container image
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docker build --file Dockerfile.cloudflare --platform linux/amd64 \
            --build-arg VITE_POSTHOG_HOST='${{ vars.VITE_POSTHOG_HOST }}' \
            --build-arg VITE_POSTHOG_PROJECT_TOKEN='${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}' \
            --build-arg GITHUB_ACTIONS=true \
            --build-arg GITHUB_SHA="$PREVIEW_SHA" \
            --build-arg GITHUB_REF_NAME="$GITHUB_HEAD_REF" \
            --build-arg GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            --build-arg GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
            --tag "praetorium-pr-$PR_NUMBER:sha-$PREVIEW_SHA" .
          docker save "praetorium-pr-$PR_NUMBER:sha-$PREVIEW_SHA" --output "$RUNNER_TEMP/container.tar"
      - name: Bundle Worker without credentials
        run: pnpm exec wrangler deploy --config wrangler.staging.jsonc --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Assemble preview artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-preview"
          mv "$RUNNER_TEMP/container.tar" "$RUNNER_TEMP/cloudflare-preview/container.tar"
          cp "$RUNNER_TEMP/worker/worker.js" "$RUNNER_TEMP/cloudflare-preview/worker.js"
          cp spacetimedb/dist/bundle.js "$RUNNER_TEMP/cloudflare-preview/product.js"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cloudflare-preview
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
