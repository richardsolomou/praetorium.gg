name: Cloudflare preview image

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      rehearsal:
        type: choice
        required: true
        options: [identity, staging, preview, preview-cleanup, production-import]
      archive_sha256:
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-candidate/') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Build SpacetimeDB module
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build native Worker
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          NITRO_PRESET: cloudflare_module
        run: pnpm build
      - name: Bundle Worker without credentials
        run: pnpm exec wrangler deploy --config wrangler.staging.json --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Assemble preview artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-preview"
          cp "$RUNNER_TEMP/worker/nativeWorker.js" "$RUNNER_TEMP/cloudflare-preview/worker.js"
          cp -a .output/public "$RUNNER_TEMP/cloudflare-preview/assets"
          cp spacetimedb/dist/bundle.js "$RUNNER_TEMP/cloudflare-preview/product.js"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cloudflare-preview
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

  staging-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'identity'
    runs-on: ubuntu-latest
    steps:
      - name: Issue an operator identity through the protected tunnel
        env:
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          STAGING_EXPORT_KEY: ${{ secrets.STAGING_EXPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_EXPORT_KEY"
          curl --fail --silent --show-error --max-time 30 \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --request POST "${SPACETIME_URL%/}/v1/identity" \
            --output "$RUNNER_TEMP/identity.json"
          jq -e '.identity | test("^[0-9a-f]{64}$")' "$RUNNER_TEMP/identity.json" > /dev/null
          jq -e '.token | type == "string" and length > 0' "$RUNNER_TEMP/identity.json" > /dev/null
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/identity.json" -out "$RUNNER_TEMP/identity.enc" -pass env:STAGING_EXPORT_KEY
      - uses: actions/upload-artifact@v7
        with:
          name: staging-operator-identity
          path: ${{ runner.temp }}/identity.enc
          retention-days: 1
          if-no-files-found: error

  staging-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'staging'
    uses: ./.github/workflows/cloudflare-staging.yml
    secrets: inherit

  preview-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Fetch verified catalogue
        run: pnpm catalogue:sync
      - name: Build native Worker
        env:
          NITRO_PRESET: cloudflare_module
          GITHUB_SHA: ${{ github.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: pnpm build
      - name: Bundle Worker without credentials
        run: pnpm exec wrangler deploy --config wrangler.staging.json --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Build SpacetimeDB module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
      - name: Install verified catalogue assets
        run: |
          pnpm catalogue:worker
          pnpm catalogue:worker:assets
      - name: Deploy disposable isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          PR_NUMBER: 99990606
          PREVIEW_SHA: ${{ github.sha }}
          PREVIEW_WORKER_BUNDLE: ${{ runner.temp }}/worker/nativeWorker.js
          PREVIEW_ASSETS_DIR: ${{ github.workspace }}/.output/public
          PREVIEW_PRODUCT_BUNDLE: ${{ github.workspace }}/spacetimedb/dist/bundle.js
        run: pnpm exec tsx scripts/cloudflarePreview.ts deploy

  preview-cleanup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'preview-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Remove disposable isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          PR_NUMBER: 99990606
        run: pnpm exec tsx scripts/cloudflarePreview.ts delete

  production-import:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'richardsolomou' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'production-import'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Verify private migration snapshot
        env:
          IMPORT_PART_0: ${{ secrets.PRAETORIUM_IMPORT_PART_0 }}
          IMPORT_PART_1: ${{ secrets.PRAETORIUM_IMPORT_PART_1 }}
          IMPORT_PART_2: ${{ secrets.PRAETORIUM_IMPORT_PART_2 }}
          IMPORT_PART_3: ${{ secrets.PRAETORIUM_IMPORT_PART_3 }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PRODUCTION_AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$IMPORT_PART_0"
          test -n "$IMPORT_PART_1"
          test -n "$IMPORT_PART_2"
          test -n "$IMPORT_PART_3"
          test -n "$PRODUCTION_AUTH_SECRET"
          printf '%s%s%s%s' "$IMPORT_PART_0" "$IMPORT_PART_1" "$IMPORT_PART_2" "$IMPORT_PART_3" \
            | base64 --decode > "$RUNNER_TEMP/import.tar.gz"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/import.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/import"
          tar -xzf "$RUNNER_TEMP/import.tar.gz" -C "$RUNNER_TEMP/import"
          secret_sha="$(printf '%s' "$PRODUCTION_AUTH_SECRET" | sha256sum | cut -d ' ' -f 1)"
          test "$secret_sha" = "$(cat "$RUNNER_TEMP/import/auth/auth-secret.sha256")"
          printf '%s\n' "$PRODUCTION_AUTH_SECRET" > "$RUNNER_TEMP/import/auth/auth.secret"
          pnpm auth:verify "$RUNNER_TEMP/import/auth"
          pnpm product:verify "$RUNNER_TEMP/import/product"
      - name: Import and compare hosted stores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_IMPORT_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SPACETIME_URL"
          test -n "$SPACETIME_IMPORT_TOKEN"
          test -n "$SPACETIME_ACCESS_CLIENT_ID"
          test -n "$SPACETIME_ACCESS_CLIENT_SECRET"
          auth_count="$(pnpm exec wrangler d1 execute AUTH_DB --config wrangler.production.json --remote \
            --command 'SELECT (SELECT COUNT(*) FROM "user") + (SELECT COUNT(*) FROM "account") + (SELECT COUNT(*) FROM "session") + (SELECT COUNT(*) FROM "verification") + (SELECT COUNT(*) FROM "twoFactor") + (SELECT COUNT(*) FROM "rateLimit") + (SELECT COUNT(*) FROM "jwks") AS count' \
            --json | jq -er '.[0].results[0].count')"
          test "$auth_count" = 0
          pnpm product:import "$RUNNER_TEMP/import/product" "$SPACETIME_URL" praetorium-production
          pnpm exec wrangler d1 execute AUTH_DB --config wrangler.production.json --remote \
            --file "$RUNNER_TEMP/import/auth/auth.sql" --yes
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.production.json --remote \
            --output "$RUNNER_TEMP/d1-export.sql" --skip-confirmation
          python3 scripts/verifyAuthMirror.py drizzle-auth/0000_curly_gambit.sql \
            "$RUNNER_TEMP/import/auth/auth.sql" "$RUNNER_TEMP/d1-export.sql"
