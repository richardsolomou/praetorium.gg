name: Cloudflare preview image

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      rehearsal:
        type: choice
        required: true
        options: [identity, staging, preview, preview-cleanup, candidate, candidate-deploy]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-candidate/') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Build SpacetimeDB module
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build native Worker
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          NITRO_PRESET: cloudflare_module
        run: pnpm build
      - name: Bundle Worker without credentials
        run: pnpm exec wrangler deploy --config wrangler.staging.json --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Assemble preview artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-preview"
          cp "$RUNNER_TEMP/worker/nativeWorker.js" "$RUNNER_TEMP/cloudflare-preview/worker.js"
          cp -a .output/public "$RUNNER_TEMP/cloudflare-preview/assets"
          cp spacetimedb/dist/bundle.js "$RUNNER_TEMP/cloudflare-preview/product.js"
      - uses: actions/upload-artifact@v7
        with:
          name: cloudflare-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cloudflare-preview
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

  staging-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'identity'
    runs-on: ubuntu-latest
    steps:
      - name: Issue an operator identity through the protected tunnel
        env:
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          STAGING_EXPORT_KEY: ${{ secrets.STAGING_EXPORT_KEY }}
        run: |
          set -euo pipefail
          test -n "$STAGING_EXPORT_KEY"
          curl --fail --silent --show-error --max-time 30 \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --request POST "${SPACETIME_URL%/}/v1/identity" \
            --output "$RUNNER_TEMP/identity.json"
          jq -e '.identity | test("^[0-9a-f]{64}$")' "$RUNNER_TEMP/identity.json" > /dev/null
          jq -e '.token | type == "string" and length > 0' "$RUNNER_TEMP/identity.json" > /dev/null
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "$RUNNER_TEMP/identity.json" -out "$RUNNER_TEMP/identity.enc" -pass env:STAGING_EXPORT_KEY
      - uses: actions/upload-artifact@v7
        with:
          name: staging-operator-identity
          path: ${{ runner.temp }}/identity.enc
          retention-days: 1
          if-no-files-found: error

  staging-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'staging'
    uses: ./.github/workflows/cloudflare-staging.yml
    secrets: inherit

  preview-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Fetch verified catalogue
        run: pnpm catalogue:sync
      - name: Build native Worker
        env:
          NITRO_PRESET: cloudflare_module
          GITHUB_SHA: ${{ github.sha }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: pnpm build
      - name: Bundle Worker without credentials
        run: pnpm exec wrangler deploy --config wrangler.staging.json --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Build SpacetimeDB module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
      - name: Install verified catalogue assets
        run: |
          pnpm catalogue:worker
          pnpm catalogue:worker:assets
      - name: Deploy disposable isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          PR_NUMBER: 99990606
          PREVIEW_SHA: ${{ github.sha }}
          PREVIEW_WORKER_BUNDLE: ${{ runner.temp }}/worker/nativeWorker.js
          PREVIEW_ASSETS_DIR: ${{ github.workspace }}/.output/public
          PREVIEW_PRODUCT_BUNDLE: ${{ github.workspace }}/spacetimedb/dist/bundle.js
        run: pnpm exec tsx scripts/cloudflarePreview.ts deploy

  preview-cleanup:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/better-auth-d1' && inputs.rehearsal == 'preview-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Remove disposable isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.SPACETIME_URL }}
          SPACETIME_ADMIN_TOKEN: ${{ secrets.SPACETIME_ADMIN_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.SPACETIME_ACCESS_CLIENT_SECRET }}
          PR_NUMBER: 99990606
        run: pnpm exec tsx scripts/cloudflarePreview.ts delete

  candidate:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'richardsolomou' && github.ref == 'refs/heads/feat/better-auth-d1' && (inputs.rehearsal == 'candidate' || inputs.rehearsal == 'candidate-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: candidate-rehearsal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Copy imported auth and product data
        if: inputs.rehearsal == 'candidate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_EXPORT_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_IMPORT_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SPACETIME_URL"
          test -n "$SPACETIME_EXPORT_TOKEN"
          test -n "$SPACETIME_ACCESS_CLIENT_ID"
          test -n "$SPACETIME_ACCESS_CLIENT_SECRET"
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.production.json --remote \
            --output "$RUNNER_TEMP/production-auth.sql" --skip-confirmation
          candidate_tables="$(pnpm exec wrangler d1 execute AUTH_DB --config wrangler.candidate.json --remote \
            --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type = 'table' AND name = 'user'" \
            --json | jq -er '.[0].results[0].count')"
          if [[ "$candidate_tables" == 0 ]]; then
            pnpm exec wrangler d1 execute AUTH_DB --config wrangler.candidate.json --remote \
              --file "$RUNNER_TEMP/production-auth.sql" --yes
          fi
          pnpm exec wrangler d1 export AUTH_DB --config wrangler.candidate.json --remote \
            --output "$RUNNER_TEMP/candidate-auth.sql" --skip-confirmation
          touch "$RUNNER_TEMP/empty.sql"
          python3 scripts/verifyAuthMirror.py "$RUNNER_TEMP/empty.sql" \
            "$RUNNER_TEMP/production-auth.sql" "$RUNNER_TEMP/candidate-auth.sql"
          pnpm product:export:spacetime "$SPACETIME_URL" praetorium-production "$RUNNER_TEMP/candidate-product"
          pnpm product:verify "$RUNNER_TEMP/candidate-product"
      - name: Publish candidate product database
        env:
          GH_TOKEN: ${{ github.token }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_OWNER_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
          SPACETIME_IMPORT_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v2.7.0-hotfix3 -R clockworklabs/SpacetimeDB -p spacetime-x86_64-unknown-linux-gnu.tar.gz -D "$RUNNER_TEMP"
          echo 'd25c6c9e4ec5d52fe43cd7d37aaf43b9f4d4fa2d228b6ecd241ba75bdae99831  '"$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/spacetime-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP" spacetimedb-cli
          "$RUNNER_TEMP/spacetimedb-cli" build -p spacetimedb
          curl --fail --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/octet-stream' \
            --request PUT --data-binary @spacetimedb/dist/bundle.js \
            "${SPACETIME_URL%/}/v1/database/praetorium-candidate?host_type=Js"
          operator_id="$(curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: text/plain' --request POST --data-binary 'SELECT operator FROM settings' \
            "${SPACETIME_URL%/}/v1/database/praetorium-production/sql" \
            | jq -er '.[0].rows[0][0] | select(type == "string" and test("^[0-9a-f]{64}$"))')"
          jq -nc --arg operator "$operator_id" \
            '["https://candidate.praetorium.gg/api/auth", "praetorium-candidate", $operator]' \
            > "$RUNNER_TEMP/candidate-configure.json"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_OWNER_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' --request POST \
            --data-binary @"$RUNNER_TEMP/candidate-configure.json" \
            "${SPACETIME_URL%/}/v1/database/praetorium-candidate/call/configure"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $SPACETIME_OPERATOR_TOKEN" \
            --header "CF-Access-Client-Id: $SPACETIME_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $SPACETIME_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' --request POST --data-binary '[]' \
            "${SPACETIME_URL%/}/v1/database/praetorium-candidate/call/operator_health"
          if [[ "${{ inputs.rehearsal }}" == candidate ]]; then
            pnpm product:import "$RUNNER_TEMP/candidate-product" "$SPACETIME_URL" praetorium-candidate
          fi
      - name: Build and deploy protected candidate Worker
        env:
          NITRO_PRESET: cloudflare_module
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPACETIME_URL: ${{ vars.PRODUCTION_SPACETIME_URL }}
          SPACETIME_OPERATOR_TOKEN: ${{ secrets.PRODUCTION_SPACETIME_OPERATOR_TOKEN }}
          SPACETIME_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_ID }}
          SPACETIME_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_SPACETIME_ACCESS_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pnpm catalogue:sync
          pnpm build
          pnpm catalogue:worker
          pnpm catalogue:worker:assets
          snapshot_id="$(jq -r .snapshotId .output/worker-catalogue/manifest.json)"
          manifest_sha="$(sha256sum .output/worker-catalogue/manifest.json | cut -d ' ' -f 1)"
          jq --arg main "$GITHUB_WORKSPACE/cloudflare/nativeWorker.ts" \
            --arg assets "$GITHUB_WORKSPACE/.output/public" \
            --arg snapshot "$snapshot_id" --arg manifest "$manifest_sha" --arg revision "$GITHUB_SHA" \
            '.main = $main | .assets.directory = $assets | .vars.CATALOGUE_SNAPSHOT_ID = $snapshot | .vars.CATALOGUE_MANIFEST_SHA256 = $manifest | .vars.GITHUB_SHA = $revision' \
            wrangler.candidate.json > "$RUNNER_TEMP/wrangler-candidate.json"
          jq -n --arg auth "$AUTH_SECRET" --arg spacetime "$SPACETIME_URL" \
            --arg operator "$SPACETIME_OPERATOR_TOKEN" \
            --arg access_id "$SPACETIME_ACCESS_CLIENT_ID" --arg access_secret "$SPACETIME_ACCESS_CLIENT_SECRET" \
            --arg apple_client "$APPLE_CLIENT_ID" --arg apple_team "$APPLE_TEAM_ID" \
            --arg apple_key "$APPLE_KEY_ID" --arg apple_private "$APPLE_PRIVATE_KEY" \
            --arg google_client "$GOOGLE_CLIENT_ID" --arg google_secret "$GOOGLE_CLIENT_SECRET" \
            --arg discord_client "$DISCORD_CLIENT_ID" --arg discord_secret "$DISCORD_CLIENT_SECRET" \
            --arg s3_endpoint "$S3_ENDPOINT" --arg s3_bucket "$S3_BUCKET" \
            --arg s3_public "$S3_PUBLIC_BASE_URL" --arg s3_key "$S3_ACCESS_KEY_ID" \
            --arg s3_secret "$S3_SECRET_ACCESS_KEY" --arg smtp_host "$SMTP_HOST" \
            --arg smtp_port "$SMTP_PORT" --arg smtp_secure "$SMTP_SECURE" \
            --arg smtp_user "$SMTP_USER" --arg smtp_password "$SMTP_PASSWORD" \
            --arg email_from "$EMAIL_FROM" --arg expo_push "$EXPO_PUSH_ACCESS_TOKEN" \
            '{AUTH_SECRET: $auth, SPACETIME_URL: $spacetime, SPACETIME_OPERATOR_TOKEN: $operator, SPACETIME_ACCESS_CLIENT_ID: $access_id, SPACETIME_ACCESS_CLIENT_SECRET: $access_secret, APPLE_CLIENT_ID: $apple_client, APPLE_TEAM_ID: $apple_team, APPLE_KEY_ID: $apple_key, APPLE_PRIVATE_KEY: $apple_private, GOOGLE_CLIENT_ID: $google_client, GOOGLE_CLIENT_SECRET: $google_secret, DISCORD_CLIENT_ID: $discord_client, DISCORD_CLIENT_SECRET: $discord_secret, S3_ENDPOINT: $s3_endpoint, S3_BUCKET: $s3_bucket, S3_PUBLIC_BASE_URL: $s3_public, S3_ACCESS_KEY_ID: $s3_key, S3_SECRET_ACCESS_KEY: $s3_secret, SMTP_HOST: $smtp_host, SMTP_PORT: $smtp_port, SMTP_SECURE: $smtp_secure, SMTP_USER: $smtp_user, SMTP_PASSWORD: $smtp_password, EMAIL_FROM: $email_from, EXPO_PUSH_ACCESS_TOKEN: $expo_push}' \
            > "$RUNNER_TEMP/candidate-secrets.json"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-candidate.json" --dry-run --outdir "$RUNNER_TEMP/worker"
          pnpm exec wrangler deploy --config "$RUNNER_TEMP/wrangler-candidate.json" \
            --secrets-file "$RUNNER_TEMP/candidate-secrets.json"
      - name: Verify protected candidate health
        env:
          CANDIDATE_ACCESS_CLIENT_ID: ${{ secrets.CANDIDATE_ACCESS_CLIENT_ID }}
          CANDIDATE_ACCESS_CLIENT_SECRET: ${{ secrets.CANDIDATE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_ACCESS_CLIENT_ID"
          test -n "$CANDIDATE_ACCESS_CLIENT_SECRET"
          unauthenticated="$(curl --silent --show-error --output /dev/null \
            --dump-header "$RUNNER_TEMP/candidate-unauthenticated-headers" --write-out '%{http_code}' \
            --max-time 15 https://candidate.praetorium.gg/api/health)"
          if [[ "$unauthenticated" == 302 ]]; then
            grep -Eiq '^location: https://[^/]+/cdn-cgi/access/login/candidate\.praetorium\.gg' \
              "$RUNNER_TEMP/candidate-unauthenticated-headers"
          else
            test "$unauthenticated" = 403
          fi
          for attempt in {1..30}; do
            headers="$(curl --silent --show-error --dump-header - --output /dev/null --max-time 10 \
              --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
              https://candidate.praetorium.gg/api/health || true)"
            revision="$(awk 'tolower($1) == "x-praetorium-revision:" { gsub("\\r", "", $2); print $2 }' <<< "$headers")"
            if [[ "$revision" == "$GITHUB_SHA" ]]; then
              echo "Protected candidate serves $GITHUB_SHA"
              break
            fi
            echo "Waiting for protected candidate revision ($attempt/30)"
            sleep 10
          done
          if [[ "$revision" != "$GITHUB_SHA" ]]; then
            echo "Protected candidate did not serve $GITHUB_SHA" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
            --output "$RUNNER_TEMP/candidate-home.html" https://candidate.praetorium.gg/
          grep -q 'Praetorium' "$RUNNER_TEMP/candidate-home.html"
          curl --fail --silent --show-error --max-time 30 \
            --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
            --output "$RUNNER_TEMP/candidate-faction.html" https://candidate.praetorium.gg/factions/necrons/datasheets
          grep -q 'Necrons' "$RUNNER_TEMP/candidate-faction.html"
          curl --fail --silent --show-error --max-time 15 \
            --output "$RUNNER_TEMP/candidate-openid.json" \
            https://candidate.praetorium.gg/api/auth/.well-known/openid-configuration
          jq -e '.issuer == "https://candidate.praetorium.gg/api/auth" and .jwks_uri == "https://candidate.praetorium.gg/api/auth/jwks"' \
            "$RUNNER_TEMP/candidate-openid.json" > /dev/null
          curl --fail --silent --show-error --max-time 15 \
            --output "$RUNNER_TEMP/candidate-jwks.json" https://candidate.praetorium.gg/api/auth/jwks
          jq -e '.keys | type == "array" and length > 0' "$RUNNER_TEMP/candidate-jwks.json" > /dev/null
          for path in /api/auth/jwks/ /api/auth/.well-known/openid-configuration/ /api/auth/get-session; do
            protected="$(curl --silent --show-error --output /dev/null \
              --dump-header "$RUNNER_TEMP/candidate-protected-headers" --write-out '%{http_code}' \
              --max-time 15 "https://candidate.praetorium.gg$path")"
            if [[ "$protected" == 302 ]]; then
              grep -Eiq '^location: https://[^/]+/cdn-cgi/access/login/candidate\.praetorium\.gg' \
                "$RUNNER_TEMP/candidate-protected-headers"
            else
              test "$protected" = 403
            fi
          done
          echo 'Protected candidate pages and auth metadata are healthy'
      - name: Verify imported candidate session and SpacetimeDB access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.PRODUCTION_AUTH_SECRET }}
          CANDIDATE_ACCESS_CLIENT_ID: ${{ secrets.CANDIDATE_ACCESS_CLIENT_ID }}
          CANDIDATE_ACCESS_CLIENT_SECRET: ${{ secrets.CANDIDATE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          session="$(pnpm exec wrangler d1 execute AUTH_DB --config wrangler.candidate.json --remote \
            --command 'SELECT token, userId FROM session WHERE expiresAt > unixepoch() * 1000 ORDER BY expiresAt DESC LIMIT 1' \
            --json)"
          session_token="$(jq -er '.[0].results[0].token' <<< "$session")"
          expected_user="$(jq -er '.[0].results[0].userId' <<< "$session")"
          cookie="$(SESSION_TOKEN="$session_token" node -e '
            const { createHmac } = require("node:crypto")
            const token = process.env.SESSION_TOKEN
            const signature = createHmac("sha256", process.env.AUTH_SECRET).update(token).digest("base64")
            process.stdout.write("__Secure-better-auth.session_token=" + token + "." + signature)
          ')"
          curl --fail --silent --show-error --max-time 20 \
            --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
            --header "Cookie: $cookie" \
            --output "$RUNNER_TEMP/candidate-session.json" \
            https://candidate.praetorium.gg/api/auth/get-session
          test "$(jq -er '.user.id' "$RUNNER_TEMP/candidate-session.json")" = "$expected_user"
          curl --fail --silent --show-error --max-time 20 \
            --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
            --header "Cookie: $cookie" \
            --output "$RUNNER_TEMP/candidate-ticket.json" \
            https://candidate.praetorium.gg/api/spacetime/token
          test "$(jq -er '.database' "$RUNNER_TEMP/candidate-ticket.json")" = praetorium-candidate
          ticket="$(jq -er '.token' "$RUNNER_TEMP/candidate-ticket.json")"
          curl --fail --silent --show-error --max-time 20 --request POST \
            --header "CF-Access-Client-Id: $CANDIDATE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CANDIDATE_ACCESS_CLIENT_SECRET" \
            --header "Authorization: Bearer $ticket" \
            --output "$RUNNER_TEMP/candidate-websocket-token.json" \
            https://candidate.praetorium.gg/spacetime/v1/identity/websocket-token
          jq -e '.token | type == "string" and length > 0' "$RUNNER_TEMP/candidate-websocket-token.json" > /dev/null
          echo 'Imported candidate session and SpacetimeDB token exchange are healthy'
