name: CI unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ./.github/actions/catalogue-sync
        with:
          r2-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      # `scripts/releasedServer.test.ts` runs the released server against this module. A merge without a changeset
      # deploys without a tag, so production's own revision header names the released server. Retries outlast a deploy's swap.
      - name: Check out the revision production runs
        run: |
          live="$(curl --silent --show-error --fail --retry 20 --retry-delay 15 --max-time 30 --head https://praetorium.gg/api/health | tr -d '\r' | sed -n 's/^x-praetorium-revision: //Ip')"
          git worktree add --detach "$RUNNER_TEMP/released" "${live:?production sent no revision}"
      - run: pnpm test:unit
        env:
          RELEASED_CHECKOUT: ${{ runner.temp }}/released
