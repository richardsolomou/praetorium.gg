name: Mobile stable

on:
  push:
    branches: [main]
    paths: [mobile/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml]

concurrency:
  group: mobile-stable
  queue: max

permissions:
  contents: write
  statuses: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      DELIVERY_SHA: ${{ github.sha }}
      DELIVERY_TAG: mobile-stable-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Finish interrupted stable deliveries
        run: sh scripts/finish-mobile-deliveries.sh "$GITHUB_REPOSITORY" mobile-stable- "Mobile stable delivery"
      - name: Check stable revision
        id: revision
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          commit_message=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DELIVERY_SHA" --jq .commit.message)
          if test "$latest_sha" != "$DELIVERY_SHA"; then
            echo "Skipping superseded revision $DELIVERY_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$commit_message" | grep -Eq '\[(eas skip|skip eas|no eas)\]'; then
            echo "Skipping EAS delivery requested by $DELIVERY_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start stable delivery
        if: steps.revision.outputs.current == 'true'
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$DELIVERY_TAG" -f sha="$DELIVERY_SHA"
      - name: Wait for stable delivery
        id: delivery
        if: steps.revision.outputs.current == 'true'
        run: |
          if sh scripts/wait-for-commit-status.sh "$GITHUB_REPOSITORY" "$DELIVERY_SHA" "Mobile stable delivery / Delivery complete $DELIVERY_TAG"; then
            echo "terminal=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if test "$status" -eq 2; then
              echo "terminal=false" >> "$GITHUB_OUTPUT"
            else
              echo "terminal=true" >> "$GITHUB_OUTPUT"
            fi
            exit "$status"
          fi
      - name: Remove delivery tag
        if: ${{ !cancelled() && steps.delivery.outputs.terminal == 'true' }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$DELIVERY_TAG" || true
