name: CI scope

on:
  workflow_call:
    outputs:
      runtime:
        value: ${{ jobs.changes.outputs.runtime }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Classify changed paths
        id: scope
        env:
          HEAD_SHA: ${{ github.sha }}
        # The event's base SHA goes stale once the base branch moves; the merge commit's first parent is what it merged into.
        run: BASE_SHA="$(git rev-parse "$HEAD_SHA^1")" node scripts/ciScope.ts
