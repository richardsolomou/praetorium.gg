name: Mobile iOS validation

on:
  pull_request:
    paths:
      - .github/actions/record-ios-delivery/**
      - .github/workflows/mobile.yml
      - .github/workflows/mobile-validation.yml
      - fastlane/**
      - Gemfile
      - Gemfile.lock
      - mobile/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - ras.config.ts
      - scripts/provisionWatchIos.js
      - scripts/iosDelivery.ts
      - scripts/iosDeliveryPlan.ts
      - src/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.ios.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - name: Prepare the base iOS dependencies
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ios-base" "$BASE_REVISION"
          pnpm --dir "$RUNNER_TEMP/ios-base" install --frozen-lockfile
      - name: Check iOS validation inputs
        id: ios
        env:
          MOBILE_UPDATE_CHANNEL: canary
          POSTHOG_CLI_DRY_RUN: 'true'
        run: pnpm exec tsx scripts/iosDeliveryPlan.ts native-changed "$RUNNER_TEMP/ios-base"
  build:
    # The required `build` check is CI's build lane; sharing its name let a skipped iOS build satisfy it.
    name: iOS build
    needs: [changes]
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MOBILE_UPDATE_CHANNEL: canary
      POSTHOG_CLI_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate Fastlane
        run: bundle exec fastlane lanes
      - name: Generate the iOS project
        run: pnpm --dir mobile exec expo prebuild --clean --platform ios --no-install
      - name: Install iOS dependencies
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Build the Release application
        run: xcodebuild -workspace mobile/ios/Praetorium.xcworkspace -scheme Praetorium -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
