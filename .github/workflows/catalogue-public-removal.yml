name: Catalogue public removal

# Removes the catalogue snapshots from the public bucket once the private one holds every one
# of them, byte count for byte count. The compiled runtime stays, since builds read it there.
on:
  pull_request:
    paths:
      - .github/workflows/catalogue-public-removal.yml

permissions:
  contents: read

jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: us-east-1
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      PUBLIC_KEY: ${{ secrets.CATALOGUE_R2_ACCESS_KEY_ID }}
      PUBLIC_SECRET: ${{ secrets.CATALOGUE_R2_SECRET_ACCESS_KEY }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      PRIVATE_SECRET: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Remove the public snapshots the private bucket holds
        run: |
          set -euo pipefail
          # A failed listing stops the job rather than reading as an empty bucket.
          list() {
            local objects
            objects="$(AWS_ACCESS_KEY_ID="$2" AWS_SECRET_ACCESS_KEY="$3" aws s3api list-objects-v2 --bucket "$1" --prefix catalogue/ --endpoint-url "$ENDPOINT" --query 'Contents[].[Key,Size]' --output text)"
            awk '$1 != "None" && $1 !~ /^catalogue\/runtime\//' <<< "$objects" | sort
          }
          list praetorium "$PUBLIC_KEY" "$PUBLIC_SECRET" > public.txt
          list praetorium-private "$PRIVATE_KEY" "$PRIVATE_SECRET" > private.txt
          test -s public.txt || { echo "::error::no public catalogue objects listed"; exit 1; }
          echo "public: $(wc -l < public.txt) objects; private: $(wc -l < private.txt) objects"
          missing="$(comm -23 public.txt private.txt)"
          if [ -n "$missing" ]; then
            echo "::error::the private bucket lacks these public objects:"
            echo "$missing"
            exit 1
          fi
          AWS_ACCESS_KEY_ID="$PUBLIC_KEY" AWS_SECRET_ACCESS_KEY="$PUBLIC_SECRET" aws s3 rm s3://praetorium/catalogue/ --recursive --exclude 'runtime/*' --endpoint-url "$ENDPOINT" --only-show-errors
          list praetorium "$PUBLIC_KEY" "$PUBLIC_SECRET" > left.txt
          left="$(wc -l < left.txt)"
          echo "public catalogue objects left outside runtime/: $left"
          test "$left" -eq 0
          echo "runtime objects kept: $(AWS_ACCESS_KEY_ID="$PUBLIC_KEY" AWS_SECRET_ACCESS_KEY="$PUBLIC_SECRET" aws s3 ls s3://praetorium/catalogue/runtime/ --recursive --endpoint-url "$ENDPOINT" | wc -l)"
